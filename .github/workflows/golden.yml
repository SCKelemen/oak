name: Golden File Verification

on:
  push:
    branches: [ main, master, specification ]
  pull_request:
    branches: [ main, master, specification ]

# Cancel only automatic PR runs; keep manual reruns and other events independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  verify-golden:
    name: Verify Golden Files
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.1'
    
    - name: Verify dependencies
      run: go mod verify
    
    - name: Verify golden files
      run: go run cmd/verify_golden/main.go
