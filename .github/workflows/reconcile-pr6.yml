name: Reconcile PR6 With Specification

on:
  push:
    branches:
      - feat/source-delimited-alloc-model

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/source-delimited-alloc-model
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Merge current normative specification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin specification
          git merge --no-edit origin/specification

      - name: Verify Go implementation
        run: go test -race ./...

      - name: Verify Lean specification
        working-directory: spec/lean
        run: lake build

      - name: Remove reconciliation harness and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/reconcile-pr6.yml
          git commit --amend --no-edit
          git push origin HEAD:feat/source-delimited-alloc-model
