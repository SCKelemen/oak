name: Refactor Delimited Parser

on:
  push:
    branches:
      - feat/source-delimited-alloc-model

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/source-delimited-alloc-model
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Apply mechanical refactor
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          parser_path = Path('parser/parser.go')
          p = parser_path.read_text()

          old = '''\tp := &Parser{\n\t\tsource:        source,\n'''
          new = '''\tp := &Parser{\n\t\tsource:        token.NewCursor(source),\n'''
          assert p.count(old) == 1, p.count(old)
          p = p.replace(old, new, 1)

          invocation = '''func (p *Parser) parseInvocationExpression(function ast.Expression) ast.Expression {
          \texp := &ast.InvocationExpression{Token: p.currentToken, Function: function}
          \targs, ok := p.parseDelimited[ast.Expression](
          \t\ttoken.LPAREN,
          \t\ttoken.RPAREN,
          \t\ttoken.COMMA,
          \t\tfalse,
          \t\tfunc() (ast.Expression, bool) {
          \t\t\targ := p.parseExpression(LOWEST)
          \t\t\treturn arg, arg != nil
          \t\t},
          \t)
          \tif !ok {
          \t\treturn nil
          \t}
          \texp.Arguments = args
          \treturn exp
          }

          // Parse field access'''
          p, n = re.subn(r'func \(p \*Parser\) parseInvocationExpression\(function ast\.Expression\) ast\.Expression \{.*?\n\}\n\n// Parse field access', invocation, p, count=1, flags=re.S)
          assert n == 1, n

          p, n = re.subn(r'func \(p \*Parser\) parseInvocationArguments\(\) \[\]ast\.Expression \{.*?\n\}\n\nfunc \(p \*Parser\) parseBoolean', 'func (p *Parser) parseBoolean', p, count=1, flags=re.S)
          assert n == 1, n

          old_start = '\t\t// Check if this is a generic type: Name[TypeArg1, TypeArg2, ...]\n'
          old_end = '\t\t// Not a generic type - return identifier as-is\n'
          start = p.index(old_start)
          end = p.index(old_end, start)
          generic = '''\t\t// Check if this is a generic type: Name[TypeArg1, TypeArg2, ...]
          \t\tif p.peekTokenIs(token.LBRACK) {
          \t\t\tp.nextToken() // move to '['
          \t\t\ttypeArgs, ok := p.parseDelimited[ast.Expression](
          \t\t\t\ttoken.LBRACK,
          \t\t\t\ttoken.RBRACK,
          \t\t\t\ttoken.COMMA,
          \t\t\t\tfalse,
          \t\t\t\tfunc() (ast.Expression, bool) {
          \t\t\t\t\targ := p.parseTypeExpression()
          \t\t\t\t\treturn arg, arg != nil
          \t\t\t\t},
          \t\t\t)
          \t\t\tif !ok {
          \t\t\t\treturn nil
          \t\t\t}

          \t\t\tvar result ast.Expression = ident
          \t\t\tfor _, arg := range typeArgs {
          \t\t\t\tresult = &ast.IndexExpression{
          \t\t\t\t\tToken: p.currentToken,
          \t\t\t\t\tLeft:  result,
          \t\t\t\t\tIndex: arg,
          \t\t\t\t}
          \t\t\t}
          \t\t\treturn result
          \t\t}
          '''
          p = p[:start] + generic + p[end:]

          replacements = [
              ('p.parseSeparated[*ast.Identifier](token.RPAREN, token.COMMA, false,', 'p.parseDelimited[*ast.Identifier](token.LPAREN, token.RPAREN, token.COMMA, false,'),
              ('p.parseSeparated[*ast.FunctionParameter](token.RPAREN, token.COMMA, false,', 'p.parseDelimited[*ast.FunctionParameter](token.LPAREN, token.RPAREN, token.COMMA, false,'),
              ('p.parseSeparated[*ast.TypeParameter](token.RBRACK, token.COMMA, false,', 'p.parseDelimited[*ast.TypeParameter](token.LBRACK, token.RBRACK, token.COMMA, false,'),
          ]
          for old, new in replacements:
              assert p.count(old) == 1, (old, p.count(old))
              p = p.replace(old, new, 1)

          array_literal = r'''// Array literal: [expr1, expr2, ...] or [N]Type{ expr1, expr2, ... }
          func (p *Parser) parseArrayLiteral() ast.Expression {
          \topen := p.currentToken

          \t// Typed slice literal: []Type{ ... }. Non-consuming lookahead keeps
          \t// the ordinary [] expression grammar free of speculative parsing.
          \tif p.lookaheadSignificant(1).TokenKind == token.RBRACK &&
          \t\tp.lookaheadSignificant(2).TokenKind == token.IDENT &&
          \t\tp.lookaheadSignificant(3).TokenKind == token.LBRACE {
          \t\tp.nextToken() // ]
          \t\tp.nextToken() // element type
          \t\telementType := &ast.Identifier{Token: p.currentToken, Value: p.currentToken.Literal}
          \t\treturn p.parseTypedArrayLiteralWithToken(open, nil, elementType)
          \t}

          \t// Typed fixed array literal: [N]Type{ ... }.
          \tif p.lookaheadSignificant(1).TokenKind == token.INT &&
          \t\tp.lookaheadSignificant(2).TokenKind == token.RBRACK &&
          \t\tp.lookaheadSignificant(3).TokenKind == token.IDENT &&
          \t\tp.lookaheadSignificant(4).TokenKind == token.LBRACE {
          \t\tp.nextToken() // N
          \t\tsizeExpr := p.parseIntegerLiteral()
          \t\tsize, ok := sizeExpr.(*ast.IntegerLiteral)
          \t\tif !ok || size == nil {
          \t\t\treturn nil
          \t\t}
          \t\tp.nextToken() // ]
          \t\tp.nextToken() // element type
          \t\telementType := &ast.Identifier{Token: p.currentToken, Value: p.currentToken.Literal}
          \t\treturn p.parseTypedArrayLiteralWithToken(open, size, elementType)
          \t}

          \telements, ok := p.parseDelimited[ast.Expression](
          \t\ttoken.LBRACK,
          \t\ttoken.RBRACK,
          \t\ttoken.COMMA,
          \t\tfalse,
          \t\tfunc() (ast.Expression, bool) {
          \t\t\telement := p.parseExpression(LOWEST)
          \t\t\treturn element, element != nil
          \t\t},
          \t)
          \tif !ok {
          \t\treturn nil
          \t}
          \treturn &ast.ArrayLiteral{Token: open, Elements: elements}
          }

          // Parse type-qualified literal'''
          p, n = re.subn(r'// Array literal: \[expr1, expr2, \.\.\.\] or \[N\]Type\{ expr1, expr2, \.\.\. \}\nfunc \(p \*Parser\) parseArrayLiteral\(\) ast\.Expression \{.*?\n\}\n\n// Parse type-qualified literal', array_literal, p, count=1, flags=re.S)
          assert n == 1, n

          typed_array = r'''func (p *Parser) parseTypedArrayLiteralWithToken(bracketToken token.Token, size *ast.IntegerLiteral, elementType ast.Expression) ast.Expression {
          \tvar index ast.Expression
          \tif size == nil {
          \t\tindex = &ast.Identifier{Token: bracketToken, Value: ""}
          \t} else {
          \t\tindex = size
          \t}
          \tarrayType := &ast.IndexExpression{Token: bracketToken, Left: elementType, Index: index}

          \tif !p.expectPeek(token.LBRACE) {
          \t\treturn nil
          \t}
          \telements, ok := p.parseDelimited[ast.Expression](
          \t\ttoken.LBRACE,
          \t\ttoken.RBRACE,
          \t\ttoken.COMMA,
          \t\tfalse,
          \t\tfunc() (ast.Expression, bool) {
          \t\t\telement := p.parseExpression(LOWEST)
          \t\t\treturn element, element != nil
          \t\t},
          \t)
          \tif !ok {
          \t\treturn nil
          \t}
          \treturn &ast.ArrayLiteral{Token: bracketToken, Elements: elements, Type: arrayType}
          }

          // Function statement'''
          p, n = re.subn(r'func \(p \*Parser\) parseTypedArrayLiteralWithToken\(bracketToken token\.Token, size \*ast\.IntegerLiteral, elementType ast\.Expression\) ast\.Expression \{.*?\n\}\n\n// Function statement', typed_array, p, count=1, flags=re.S)
          assert n == 1, n

          # Record parsers keep lookup maps for compatibility but now also retain source order.
          assert p.count('fieldName := p.currentToken.Literal') == 2, p.count('fieldName := p.currentToken.Literal')
          p = p.replace('fieldName := p.currentToken.Literal', 'fieldToken := p.currentToken\n\t\tfieldName := fieldToken.Literal')
          assert p.count('record.Fields[fieldName] = fieldType') == 1
          p = p.replace('record.Fields[fieldName] = fieldType', 'record.AddField(fieldToken, fieldName, fieldType)', 1)
          assert p.count('record.Fields[fieldName] = fieldValue') == 1
          p = p.replace('record.Fields[fieldName] = fieldValue', 'record.AddField(fieldToken, fieldName, fieldValue)', 1)

          parser_path.write_text(p)

          ast_path = Path('ast/ast.go')
          a = ast_path.read_text()
          assert '"sort"' not in a
          a = a.replace('"fmt"\n\t"strings"', '"fmt"\n\t"sort"\n\t"strings"', 1)

          old = '''// RecordLiteral: { field1: value1, field2: value2, ... }\ntype RecordLiteral struct {\n\tBaseNode\n\tToken    token.Token // { token or struct token\n\tEndToken token.Token // } token (for end position)\n\tFields   map[string]Expression\n\tTypeName *Identifier // optional type name for type-qualified literals: TypeName{ ... }\n}\n'''
          new = '''// RecordField is one record member in source order. Value is either a value\n// expression or a type expression depending on the record's syntactic context.\ntype RecordField struct {\n\tToken token.Token\n\tName  string\n\tValue Expression\n}\n\n// RecordLiteral represents both record value and record type syntax. Fields is\n// retained for O(1) compatibility lookup; FieldOrder is the authoritative source\n// order used by semantics, formatting, and eventual layout derivation.\ntype RecordLiteral struct {\n\tBaseNode\n\tToken      token.Token // { token or struct token\n\tEndToken   token.Token // } token (for end position)\n\tFields     map[string]Expression\n\tFieldOrder []RecordField\n\tTypeName   *Identifier // optional type name for type-qualified literals: TypeName{ ... }\n}\n\nfunc (rl *RecordLiteral) AddField(tok token.Token, name string, value Expression) {\n\tif rl.Fields == nil {\n\t\trl.Fields = make(map[string]Expression)\n\t}\n\trl.Fields[name] = value\n\trl.FieldOrder = append(rl.FieldOrder, RecordField{Token: tok, Name: name, Value: value})\n}\n\n// OrderedFields returns source order when it is known. It deliberately returns\n// nil for legacy/manually-built map-only records rather than fabricating order.\nfunc (rl *RecordLiteral) OrderedFields() []RecordField {\n\tif len(rl.FieldOrder) == 0 {\n\t\treturn nil\n\t}\n\treturn rl.FieldOrder\n}\n'''
          assert a.count(old) == 1
          a = a.replace(old, new, 1)

          old = '''\tfirst := true\n\tfor field, expr := range rl.Fields {\n\t\tif !first {\n\t\t\tout.WriteString(", ")\n\t\t}\n\t\tout.WriteString(field)\n\t\tout.WriteString(": ")\n\t\tout.WriteString(expr.String())\n\t\tfirst = false\n\t}\n'''
          new = '''\tif len(rl.FieldOrder) > 0 {\n\t\tfor i, field := range rl.FieldOrder {\n\t\t\tif i > 0 {\n\t\t\t\tout.WriteString(", ")\n\t\t\t}\n\t\t\tout.WriteString(field.Name)\n\t\t\tout.WriteString(": ")\n\t\t\tout.WriteString(field.Value.String())\n\t\t}\n\t} else {\n\t\t// Legacy/manual ASTs have no source order. Sort only for deterministic\n\t\t// rendering; semantic/layout code must not treat this as source order.\n\t\tnames := make([]string, 0, len(rl.Fields))\n\t\tfor name := range rl.Fields {\n\t\t\tnames = append(names, name)\n\t\t}\n\t\tsort.Strings(names)\n\t\tfor i, name := range names {\n\t\t\tif i > 0 {\n\t\t\t\tout.WriteString(", ")\n\t\t\t}\n\t\t\tout.WriteString(name)\n\t\t\tout.WriteString(": ")\n\t\t\tout.WriteString(rl.Fields[name].String())\n\t\t}\n\t}\n'''
          assert a.count(old) == 1
          a = a.replace(old, new, 1)
          ast_path.write_text(a)

          semantic_path = Path('compiler/semantic_types.go')
          s = semantic_path.read_text()
          assert s.count('\t"sort"\n') == 1
          s = s.replace('\t"sort"\n', '', 1)
          s = s.replace('// program. It never invents representation information that the AST cannot\n// justify. In particular, record membership is preserved but field layout stays\n// unspecified because the historical AST stores record fields in a map.', '// program. It never invents representation information that the AST cannot\n// justify. Record source order is preserved; concrete ABI offsets remain unknown\n// until a target layout pass computes them.')
          s = s.replace('// Representation intentionally stays unspecified until source field\n\t\t\t// order is preserved by the typed syntax representation.', '// Representation intentionally stays unspecified until a target-specific\n\t\t\t// layout pass computes sizes, alignments, and offsets.')

          old = '''func buildRecordFields(record *ast.RecordLiteral) ([]semir.Field, error) {\n\tif record == nil {\n\t\treturn nil, fmt.Errorf("nil record")\n\t}\n\tnames := make([]string, 0, len(record.Fields))\n\tfor name := range record.Fields {\n\t\tnames = append(names, name)\n\t}\n\tsort.Strings(names)\n\n\tfields := make([]semir.Field, 0, len(names))\n\tfor _, name := range names {\n\t\tfieldType, err := semanticTypeName(record.Fields[name])\n\t\tif err != nil {\n\t\t\treturn nil, fmt.Errorf("field %q: %w", name, err)\n\t\t}\n\t\tfields = append(fields, semir.Field{Name: name, Type: fieldType})\n\t}\n\treturn fields, nil\n}\n'''
          new = '''func buildRecordFields(record *ast.RecordLiteral) ([]semir.Field, error) {\n\tif record == nil {\n\t\treturn nil, fmt.Errorf("nil record")\n\t}\n\tordered := record.OrderedFields()\n\tif len(record.Fields) > 0 && len(ordered) == 0 {\n\t\treturn nil, fmt.Errorf("record source order is unavailable")\n\t}\n\n\tfields := make([]semir.Field, 0, len(ordered))\n\tfor _, field := range ordered {\n\t\tfieldType, err := semanticTypeName(field.Value)\n\t\tif err != nil {\n\t\t\treturn nil, fmt.Errorf("field %q: %w", field.Name, err)\n\t\t}\n\t\tfields = append(fields, semir.Field{Name: field.Name, Type: fieldType})\n\t}\n\treturn fields, nil\n}\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          semantic_path.write_text(s)
          PY

          gofmt -w parser/parser.go ast/ast.go compiler/semantic_types.go
          go test -race ./...

      - name: Commit validated refactor
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add parser/parser.go ast/ast.go compiler/semantic_types.go
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Unify delimited parsing and preserve record order"
          git push origin HEAD:feat/source-delimited-alloc-model
