name: Fix Duplicate Record Fields

on:
  push:
    branches:
      - feat/source-delimited-alloc-model

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/source-delimited-alloc-model
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1

      - name: Apply repair
        run: python3 tools/fix_record_duplicates.py

      - name: Format
        run: gofmt -w ast/ast.go parser/parser.go parser/record_duplicates_test.go

      - name: Verify
        run: go test -race ./...

      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-record-duplicates.yml tools/fix_record_duplicates.py
          git add -A
          git commit -m "Reject duplicate record fields"
          git push origin HEAD:feat/source-delimited-alloc-model
