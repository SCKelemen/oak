name: Crypto foundation
on:
  push:
    branches: [specification, codex/crypto-foundation]
  pull_request:
    branches: [specification]
# Cancel only automatic PR runs; keep manual reruns and other events independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Oak public vectors and rejection contracts
        run: go test ./compiler -run '^TestE2ECrypto' -count=1 -timeout 10m
      - name: Proof result parser rejects incomplete evidence
        run: go test ./spec/tamarin/crypto -count=1
  protocols:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Install pinned Tamarin and Maude
        run: |
          mkdir -p "$RUNNER_TEMP/oak-crypto-tools/maude"
          cd "$RUNNER_TEMP/oak-crypto-tools"
          curl -fsSL --retry 3 -o tamarin.tar.gz https://github.com/tamarin-prover/tamarin-prover/releases/download/1.12.0/tamarin-prover-1.12.0-linux64-ubuntu.tar.gz
          curl -fsSL --retry 3 -o maude.zip https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip
          echo '201be06f469e47cff554df6ca93db8366fc2c69d70c61fcbd1370a1074b469c6  tamarin.tar.gz' | sha256sum -c -
          echo '72ed1ca87e3b3d0dfc6ee1436baf154bf04c45ff97d521bec040c5e8dfc8f92c  maude.zip' | sha256sum -c -
          tar --no-same-owner -xzf tamarin.tar.gz
          unzip -q maude.zip -d maude
          echo "$RUNNER_TEMP/oak-crypto-tools" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/oak-crypto-tools/maude" >> "$GITHUB_PATH"
      - name: Prove models and detect the expected DH attack
        run: go run ./spec/tamarin/crypto -out "$RUNNER_TEMP/oak-crypto-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crypto-protocol-evidence
          path: ${{ runner.temp }}/oak-crypto-evidence
