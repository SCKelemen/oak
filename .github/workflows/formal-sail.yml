name: Formal Verification (Sail)

# The links between Oak's semantics and the Sail ISA specifications
# (docs/spec/94-assembler.md §8–§9, docs/notes/verification-chain-2026-09.md
# §4.1). Every input is fetched here, pinned, and required: the tests that
# would skip without an oracle fail instead (OAK_REQUIRE_ORACLES).
#
#   - spec/sail/lean: Arm's ASL → Sail → Lean ≡ Oak.ArmASL, built with lake
#     against rems-project/lean-sail (spec/sail/setup.sh pins the revision)
#   - asm/sail_lean_test.go: the committed Sail-generated Lean equals what
#     the pinned Sail release generates
#   - asm/sail_coverage_test.go: the AArch64 table audited against Arm's
#     decode tree (rems-project/sail-arm), llvm-mc as the text oracle
#   - asm/sail_barrier_dispatch_test.go: the six official barrier call targets
#     and the model's still-erased ISB/context synchronization bodies
#   - asm/sail_stp64_dispatch_test.go: the official offset-STP64 decode and
#     its two separately projected pre-Mem address/data requests
#   - asm/sail_ram_effect_test.go: the exact no-device RAM wrapper and the
#     separate Lem backend's plain-write requests (not a CAT refinement)
#   - asm/sail_write_memory_effect_test.go: the actual RAM-selector read,
#     write/trace/return order, and the official no-device trace expression
#   - lem-ram-traces (separate job): execute the official Arm Lem RAM wrapper
#     against the pinned Sail prompt runtime; request traces, NOT CAT effects
#     and generate the audited __WriteMemory declarations through Sail's Lem
#     backend, preserving the selector read before the memory requests
#     and replay those requests using Sail's original register/memory state
#     functions; neither replay alone certifies execution or Arm ordering
#     and kernel-check exported original prompt requests with the Lean
#     occurrence projector; the exporter/parser remain executable glue
#   - asm/rv64_sail_test.go: the RV64 differential units under the Sail
#     RISC-V C emulator (the riscv/sail-riscv release binary)
#   - asm/rv64_qemu_test.go: the same units under QEMU
#   - asm/rv64_test.go: every RV64 mnemonic against GNU as
#   - asm/rv64_sail_bridge_test.go: the RV64 bridge's restated definitions
#     have not drifted from spec/lean/Oak/RiscV.lean
#   - rv64-bridge (second job): the Sail RISC-V model's Lean export is
#     generated from the pinned sail-riscv release, repaired by
#     spec/lean-sail/patch-export.py, built, and spec/lean-sail is proved
#     against it (the data semantics, the execute bodies, the encodings);
#     the export is cached by its pins, since generating it takes half an
#     hour and building it a few minutes more

on:
  push:
    branches:
      - specification
    paths:
      - 'asm/**'
      - 'spec/sail/**'
      - 'spec/lean/Oak/RiscV.lean'
      - 'spec/lean/Oak/ArmASL.lean'
      - 'spec/lean/Oak/AssemblerSemantics.lean'
      - 'spec/lean/Oak/SpanArguments.lean'
      - 'spec/lean/Oak/AArch64Encoding.lean'
      - 'spec/lean/Oak/AArch64ReturnEncoding.lean'
      - 'spec/lean/Oak/AArch64DirectBranchEncoding.lean'
      - 'spec/lean/Oak/AArch64CallBranchEncoding.lean'
      - 'spec/lean/Oak/AArch64SysReg.lean'
      - 'spec/lean/Oak/AArch64ColdEntry.lean'
      - 'spec/lean-sail/**'
      - 'spec/lean-sail433/**'
      - 'spec/lean-sail429/**'
      - 'spec/lean/Oak/ByteFields.lean'
      - 'spec/lean/Oak/BitwiseSource.lean'
      - 'spec/lean/Oak/ArmDecoderClassification/**'
      - 'spec/lean/Oak/ArmDecoderPartition/**'
      - 'compiler/arm_decoder_partition_test.go'
      - 'compiler/arm_decoder_classification_test.go'
      - 'spec/lean/Oak/RiscVFramedBitwise.lean'
      - 'compiler/rv64_framed_bitwise_lean_test.go'
      - '.github/workflows/formal-sail.yml'
  pull_request:
    branches:
      - specification
  workflow_dispatch:

permissions:
  contents: read

env:
  SAIL_RELEASE: 0.20.2-binary
  SAIL_SHA256: 26b59bcab2d66e9f220d317dfe45f8b09170ed70e59a824553d6f525134d1ff6
  SAIL_RISCV_RELEASE: "0.14"
  SAIL_RISCV_SHA256: 363f851ba91c674cd818040e232c4baf0ec382406a0a9696b1dde687ea160b2a
  SAIL_ARM_COMMIT: 1bf2e5574ba9d704639a28401b6a387dcb113cae
  # The RV64 export needs Sail built from git (spec/lean-sail/README.md):
  # the 0.20.2 release's Lean backend predates the `LeanRV64D` namespace and
  # the lean-sail v5 pin that sail-riscv 0.14's hand-written RiscvExtras.lean
  # expects, so its export does not compile. sail-riscv's own Lean CI builds
  # Sail from source for the same reason.
  SAIL_GIT_COMMIT: dba5f0078f3a4c8d854ddda1d7ba5f59370c1d02
  OCAML_VERSION: 5.2.1
  # The sail-riscv commit whose Lean export compiles (spec/lean-sail/README.md,
  # Status): later models export vmem_types.sail with unbound `k_v`.
  SAIL_RISCV_COMMIT: 497209b9298bf11b040e000095fe24c51a598a1d

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}


jobs:
  sail:
    name: Sail bridges and oracles
    runs-on: ubuntu-24.04
    # Includes serial, bounded validation of 917 source-classification certificates.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the oracles' tools (RISC-V GNU tools, QEMU, llvm-mc)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf qemu-system-misc llvm build-essential libgmp-dev pkg-config
          llvm-mc --version | head -1
          riscv64-unknown-elf-gcc --version | head -1

      - name: Install the pinned Sail release
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/rems-project/sail/releases/download/${SAIL_RELEASE}/sail-Linux-x86_64.tar.gz" -o /tmp/sail.tar.gz
          echo "${SAIL_SHA256}  /tmp/sail.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sail.tar.gz -C "$HOME"
          echo "$HOME/sail/bin" >> "$GITHUB_PATH"
          # The release bundles the z3 Sail shells out to; within this step
          # PATH does not yet carry GITHUB_PATH, so name the directory.
          PATH="$HOME/sail/bin:$PATH" sail --version

      - name: Install the pinned Sail RISC-V emulator
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/riscv/sail-riscv/releases/download/${SAIL_RISCV_RELEASE}/sail-riscv-Linux-x86_64.tar.gz" -o /tmp/sail-riscv.tar.gz
          echo "${SAIL_RISCV_SHA256}  /tmp/sail-riscv.tar.gz" | sha256sum -c -
          mkdir -p external/sail-riscv/build/c_emulator
          tar -xzf /tmp/sail-riscv.tar.gz -C /tmp sail-riscv-Linux-x86_64/bin/sail_riscv_sim
          install -m 0755 /tmp/sail-riscv-Linux-x86_64/bin/sail_riscv_sim external/sail-riscv/build/c_emulator/sail_riscv_sim
          external/sail-riscv/build/c_emulator/sail_riscv_sim --version

      - name: Fetch Arm's pinned Sail model sources
        run: |
          set -euo pipefail
          git init -q external/sail-arm
          git -C external/sail-arm remote add origin https://github.com/rems-project/sail-arm.git
          git -C external/sail-arm sparse-checkout init --cone
          git -C external/sail-arm sparse-checkout set arm-v8.5-a/model
          git -C external/sail-arm fetch -q --depth 1 --filter=blob:none origin "${SAIL_ARM_COMMIT}"
          git -C external/sail-arm checkout -q FETCH_HEAD
          test -f external/sail-arm/arm-v8.5-a/model/aarch_decode.sail
          test -f external/sail-arm/arm-v8.5-a/aarch64_extras.lem

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the Sail Lean support library at its pinned revision
        run: sh spec/sail/setup.sh

      - name: Build the Arm bridges (semantics, STR boundaries, registers, RAM, and spans)
        working-directory: spec/sail/lean
        run: lake build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Run the oracle tests, every oracle required
        env:
          OAK_REQUIRE_ORACLES: "1"
        run: go test ./asm -run 'TestSailLeanGenerationCurrent|TestSailDecodeCoverage|TestSailArmBarrierDispatchSource|TestSailArmVMALLS12E1ISDispatchSource|TestSailArmSTR64StoreRequestSource|TestSailArmSTR64WriteMemoryArgumentsSource|TestSailNoDeviceRAMWrapperExactAndMutated|TestSailLemRAMRequestsRemainPlain|TestSailRegisterMemoryWrapperExactAndMutated|TestSailNoDeviceWriteTraceExactAndMutated|TestSailArmSTP64StoreRequestsSource|TestSailArmDAIFSetDispatchSource|TestSailArmVTTBREL2WriteDispatchSource|TestSailArmHCREL2WriteDispatchSource|TestSailArmVTCREL2WriteDispatchSource|TestSailArmCNTHCTLEL2WriteDispatchSource|TestSailArmCNTVOFFEL2WriteDispatchSource|TestSailArmSPEL1WriteDispatchSource|TestSailArmELREL2WriteDispatchSource|TestSailArmSPSREL2WriteDispatchSource|TestSailArmPlainERETDispatchSource|TestSailArmOrdinaryRETDispatchSource|TestSailArmDirectBDispatchSource|TestSailArmDirectBLDispatchSource|TestAArch64DirectBranchLocalEncodingMatchesLean|TestAArch64CallBranchLocalEncodingMatchesLean|TestColdEntryRegisterSequenceMatchesNativePrefix|TestSailColdEntryRegisterSequenceProjection|TestRV64SailDifferential|TestRV64QEMUDifferential|TestRV64EncoderAgreesWithGNUAs|TestRV64RVC|TestRV64Vector|TestRV64SailBridgeDefinitionsMatch' -count=1 -v

      - name: Pin the copied Arm register bank and accessor, including mutations
        env:
          OAK_REQUIRE_ORACLES: "1"
        run: go test ./asm -run '^TestSailGeneralRegister(Bank|Read)ExactAndMutated$' -count=1 -v

      - name: Check original Arm syndrome declarations and mutation rejection
        env:
          OAK_REQUIRE_ORACLES: "1"
        run: go test ./asm -run '^TestSailSyndrome(ProcState|Registers|Make|Set)ExactAndMutated$' -count=1 -v

      - name: Check retained STR and MemSingle source, callback wiring, and generation
        env:
          OAK_REQUIRE_ORACLES: "1"
        run: go test ./asm -run '^TestSailArmSTR64Execution|^TestSailSTRExecution' -count=1 -v -timeout=10m

      - name: Regenerate and check pinned ARM scalar execution
        env:
          OAK_REQUIRE_ORACLES: "1"
        run: |
          go test ./asm -run '^TestSailScalarExecution(RawPins|Regeneration|Lean|GuardedMutationAudit|ReturnFraming)$' -count=1 -v -timeout=15m
          python3 spec/sail/audit_scalar.py
          python3 spec/sail/return_execution_regen.py --check-source
          python3 spec/sail/audit_return.py

      - name: Check complete Arm decoder source classification and negative controls
        timeout-minutes: 40
        run: |
          set -euo pipefail
          python3 spec/sail/test_decoder_classification.py
          python3 spec/sail/check_decoder_classification.py \
            --build-dir "$RUNNER_TEMP/oak-arm-decoder-classification"
          python3 spec/sail/check_decoder_byte_binding.py \
            --build-dir "$RUNNER_TEMP/oak-arm-decoder-classification"
          OAK_REQUIRE_ARM_CLASSIFICATION=1 \
            OAK_ARM_CLASSIFICATION_LIB="$RUNNER_TEMP/oak-arm-decoder-classification" \
            go test ./compiler -run '^TestArmDecoderClassificationCompilerBytes$' -count=1 -v -timeout=5m

      - name: Check complete original Arm source byte partition
        timeout-minutes: 45
        run: |
          set -euo pipefail
          python3 spec/sail/test_decoder_partition.py
          python3 spec/sail/check_decoder_partition.py \
            --source external/sail-arm/arm-v8.5-a/model/aarch_decode.sail \
            --classification-dir "$RUNNER_TEMP/oak-arm-decoder-classification" \
            --build-dir "$RUNNER_TEMP/oak-arm-decoder-partition" --jobs 2
          OAK_REQUIRE_ARM_PARTITION=1 \
            OAK_ARM_PARTITION_LIB="$RUNNER_TEMP/oak-arm-decoder-partition" \
            go test ./compiler -run '^TestArmDecoderPartitionCompilerBytes$' -count=1 -v -timeout=5m

      - name: Preserve original-source partition kernel checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-decoder-partition
          path: |
            ${{ runner.temp }}/oak-arm-decoder-partition/*.json
            ${{ runner.temp }}/oak-arm-decoder-partition/*.log
          if-no-files-found: warn

      - name: Preserve decoder classification kernel checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-decoder-classification
          path: |
            ${{ runner.temp }}/oak-arm-decoder-classification/*.json
            ${{ runner.temp }}/oak-arm-decoder-classification/*.log
          if-no-files-found: ignore

      - name: Cache checksummed guarded-generator dependency downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/oak-arm-return-downloads
          key: arm-return-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('spec/sail/repros/guarded_mutation/guarded_profile/toolchain-lock.json') }}

      - name: Rebuild the separate guarded generator from pinned source and patch
        run: |
          set -euo pipefail
          python3 spec/sail/repros/guarded_mutation/guarded_profile/build.py \
            --workdir "$RUNNER_TEMP/oak-guarded-return-build" \
            --download-cache "$RUNNER_TEMP/oak-arm-return-downloads" \
            2>&1 | tee "$RUNNER_TEMP/oak-guarded-return-build.log"

      - name: Regenerate and regress the bounded guarded return profile
        run: |
          set -euo pipefail
          # Scoped to this step: the official Sail installation is unchanged.
          source "$RUNNER_TEMP/oak-guarded-return-build/env.sh"
          export OAK_LEAN_SAIL_SUPPORT="$(realpath ../external/lean-sail)"
          python3 spec/sail/repros/guarded_mutation/guarded_profile/check_build.py \
            2>&1 | tee "$RUNNER_TEMP/oak-guarded-return-provenance-tests.log"
          python3 spec/sail/return_execution_regen.py --regenerate \
            2>&1 | tee "$RUNNER_TEMP/oak-guarded-return-regeneration.log"
          python3 spec/sail/repros/guarded_mutation/guarded_profile/check.py \
            --output-dir "$RUNNER_TEMP/oak-guarded-return-regressions" \
            2>&1 | tee "$RUNNER_TEMP/oak-guarded-return-regressions.log"
          python3 spec/sail/audit_return.py

      - name: Preserve guarded-build provenance and regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guarded-arm-return-provenance
          path: |
            ${{ runner.temp }}/oak-guarded-return-build/build-receipt.json
            ${{ runner.temp }}/oak-guarded-return-*.log
            ${{ runner.temp }}/oak-guarded-return-regressions/*.log
          if-no-files-found: ignore
          retention-days: 14

  lem-ram-traces:
    name: Arm Lem RAM request traces
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OCaml build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends opam libgmp-dev pkg-config z3

      - name: Restore the pinned Lem and Sail runtime
        id: lem-cache
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: arm-lem-ram-sail-0.20.2-lem-2026-05-01-ocaml-${{ env.OCAML_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build the pinned Lem and Sail runtime
        if: steps.lem-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          opam init --yes --no-setup --bare --disable-sandboxing
          opam switch create arm-lem "ocaml-base-compiler.${OCAML_VERSION}" --yes
          opam install --switch arm-lem --yes sail.0.20.2 libsail.0.20.2 lem.2026-05-01 ocamlfind

      - name: Put the pinned switch on PATH
        run: echo "$HOME/.opam/arm-lem/bin" >> "$GITHUB_PATH"

      - name: Fetch Arm's pinned Lem wrapper
        run: |
          set -euo pipefail
          git init -q external/sail-arm
          git -C external/sail-arm remote add origin https://github.com/rems-project/sail-arm.git
          git -C external/sail-arm sparse-checkout init --cone
          git -C external/sail-arm sparse-checkout set arm-v8.5-a/model
          git -C external/sail-arm fetch -q --depth 1 --filter=blob:none origin "${SAIL_ARM_COMMIT}"
          git -C external/sail-arm checkout -q FETCH_HEAD
          test -f external/sail-arm/arm-v8.5-a/aarch64_extras.lem

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Install pinned Lean for the observed request projection
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" +leanprover/lean4:v4.33.1 --version

      - name: Check RAM, generated wrapper, state replay, and observed projection with mutants
        env:
          OAK_REQUIRE_ORACLES: "1"
        run: go test ./asm -run '^TestSail(LemRAMTraces|LemWriteMemoryTraces|LemStateReplay|MemoryEffectFragmentExactAndMutated|LemMemoryExportParser|LemMemoryTraceProjection)$' -count=1 -v -timeout=10m

  rv64-bridge:
    name: RV64 bridge against the Sail export
    runs-on: ubuntu-24.04
    # Sail from source (~25 min) and the export (~90 min) on a cold cache;
    # minutes with both caches warm.
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the export's build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libgmp-dev zlib1g-dev python3 pkg-config opam z3

      # The opam switch holding Sail, keyed by the commit and the compiler.
      - name: Restore Sail built from git
        id: sail-cache
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: sail-git-${{ env.SAIL_GIT_COMMIT }}-ocaml-${{ env.OCAML_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build Sail from git
        if: steps.sail-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          opam init --yes --no-setup --bare --disable-sandboxing
          opam switch create sail-dev "ocaml-base-compiler.${OCAML_VERSION}" --yes
          git clone -q https://github.com/rems-project/sail.git /tmp/sail
          git -C /tmp/sail checkout -q "${SAIL_GIT_COMMIT}"
          # Every package pinned from the one checkout: libsail's build runs
          # `sail_maker embed`, so sail_maker must come from the same tree.
          opam pin add --switch sail-dev --no-action --yes /tmp/sail
          opam install --switch sail-dev --yes sail_maker libsail sail sail_lean_backend

      - name: Put Sail on PATH
        run: |
          set -euo pipefail
          echo "$HOME/.opam/sail-dev/bin" >> "$GITHUB_PATH"
          "$HOME/.opam/sail-dev/bin/sail" --version

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # The export, generated and built, keyed by everything that shapes it:
      # the Sail commit, the sail-riscv commit, and the bridge's lean-sail pin.
      - name: Restore the built export
        id: export-cache
        uses: actions/cache@v4
        with:
          path: external/sail-riscv/build/model/Lean_RV64D
          key: rv64-export-${{ env.SAIL_GIT_COMMIT }}-${{ env.SAIL_RISCV_COMMIT }}-${{ hashFiles('spec/lean-sail/lake-manifest.json', 'spec/lean-sail/lean-toolchain') }}

      - name: Generate and build the export
        if: steps.export-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git init -q external/sail-riscv
          git -C external/sail-riscv remote add origin https://github.com/riscv/sail-riscv.git
          git -C external/sail-riscv fetch -q --depth 1 origin "${SAIL_RISCV_COMMIT}"
          git -C external/sail-riscv checkout -q FETCH_HEAD
          cmake -S external/sail-riscv -B external/sail-riscv/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build external/sail-riscv/build --target generated_lean_rv64d
          cd external/sail-riscv/build/model/Lean_RV64D
          lake update
          lake build

      - name: Prove the bridge against the export
        working-directory: spec/lean-sail
        run: lake build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Run the bridge tests, the export required
        env:
          OAK_REQUIRE_ORACLES: "1"
        run: go test ./asm -run 'TestRV64SailBridge' -count=1 -v

      - name: Verify and prepare pinned RV64 sources for Lean 4.33
        run: |
          python3 spec/lean-sail433/prepare.py --generated external/sail-riscv/build/model/Lean_RV64D
          python3 spec/lean-sail433/test_verify_export.py --generated external/sail-riscv/build/model/Lean_RV64D

      - name: Check original-source, actual fetch and stepping in Lean 4.29
        working-directory: spec/lean-sail429
        env:
          LEAN_NUM_THREADS: '2'
        run: |
          lake update
          lake build OakSailFetchedFrame OakSailSteppedFrame OakSailSteppedChecks OakSailClockedSource OakSailClockChecks OakSailImageLoad OakSailImageSource OakSailImageChecks OakSailEntryInstructions OakSailEntrySource OakSailEntryChecks
          python3 audit.py
          python3 step-audit.py
          python3 clock-audit.py
          python3 image-audit.py
          python3 entry-audit.py

      - name: Pin actual compiler source and bytes to fetched/stepped theorems
        env:
          OAK_REQUIRE_RV64_LEAN: '1'
        run: go test ./compiler -run '^TestRV64(Fetched|Stepped|Clocked|Image|Entry)BitwiseCompilerMatchesLean$' -count=1 -timeout=30m -v

      - name: Build bounded RV64 source and external execution composition
        working-directory: spec/lean-sail433
        env:
          LEAN_NUM_THREADS: '2'
        run: |
          lake update
          lake build OakSailComposition OakSailFullDispatch OakSailBridge.BitwiseDispatchAgreement OakSailFramedComposition OakSailFramedFullDispatch OakSourceSplitCompatibility OakSailFetchedCode

      - name: Audit bounded RV64 external theorem closures
        run: python3 spec/lean-sail433/audit.py

      # Publish only generated source and locked build inputs after all checks pass.
      # Never upload .lake caches, .git metadata, home directories, or credentials.
      - name: Package checked RV64 Lean export sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEXPORT'
          import hashlib, json, os, pathlib, tarfile
          root = pathlib.Path("external/sail-riscv/build/model/Lean_RV64D")
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "rv64-sail-export"
          out.mkdir()
          required = {"lakefile.toml", "lake-manifest.json", "lean-toolchain"}
          for name in required:
              assert (root / name).is_file(), f"Missing export input: {name}"
          toolchain = (root / "lean-toolchain").read_text().strip()
          assert toolchain == "leanprover/lean4:v4.29.0", toolchain
          lock = json.loads((root / "lake-manifest.json").read_text())
          sail = next(p for p in lock["packages"] if p["name"] == "Sail")
          assert sail["rev"] == "079463134b9c50450b8393e1566a09fc492a34d9", sail
          assert sail["url"].rstrip("/").removesuffix(".git") == "https://github.com/rems-project/lean-sail", sail
          files = sorted(p for p in root.rglob("*") if p.is_file()
                         and not p.is_symlink()
                         and not any(x.startswith(".") for x in p.relative_to(root).parts)
                         and (p.suffix == ".lean" or p.relative_to(root).as_posix() in required))
          assert any(p.suffix == ".lean" for p in files), "No generated Lean sources"
          hashes = []
          archive = out / "Lean_RV64D.sources.tar.gz"
          with tarfile.open(archive, "w:gz") as tar:
              for path in files:
                  name = "Lean_RV64D/" + path.relative_to(root).as_posix()
                  hashes.append(hashlib.sha256(path.read_bytes()).hexdigest() + "  " + name)
                  tar.add(path, arcname=name, recursive=False)
          (out / "FILES.sha256").write_text("\n".join(hashes) + "\n")
          provenance = {
              "oak_commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "sail_commit": os.environ["SAIL_GIT_COMMIT"],
              "sail_riscv_commit": os.environ["SAIL_RISCV_COMMIT"],
              "lean_sail_commit": sail["rev"],
              "lean_toolchain": toolchain,
              "contents": "Generated Lean sources and locked Lake build inputs; no caches",
          }
          (out / "PROVENANCE.json").write_text(json.dumps(provenance, indent=2) + "\n")
          (out / "SHA256SUMS").write_text("".join(
              hashlib.sha256(p.read_bytes()).hexdigest() + "  " + p.name + "\n"
              for p in sorted(out.iterdir()) if p.is_file()))
          PYEXPORT

      - name: Upload checked RV64 Lean export sources
        uses: actions/upload-artifact@v4
        with:
          name: rv64-sail-export-${{ github.sha }}
          path: ${{ runner.temp }}/rv64-sail-export/
          if-no-files-found: error
          retention-days: 14
