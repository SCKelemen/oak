name: Formal Verification (Sail)

# The links between Oak's semantics and the Sail ISA specifications
# (docs/spec/94-assembler.md §8–§9, docs/notes/verification-chain-2026-09.md
# §4.1). Every input is fetched here, pinned, and required: the tests that
# would skip without an oracle fail instead (OAK_REQUIRE_ORACLES).
#
#   - spec/sail/lean: Arm's ASL → Sail → Lean ≡ Oak.ArmASL, built with lake
#     against rems-project/lean-sail (spec/sail/setup.sh pins the revision)
#   - asm/sail_lean_test.go: the committed Sail-generated Lean equals what
#     the pinned Sail release generates
#   - asm/sail_coverage_test.go: the AArch64 table audited against Arm's
#     decode tree (rems-project/sail-arm), llvm-mc as the text oracle
#   - asm/sail_barrier_dispatch_test.go: the six official barrier call targets
#     and the model's still-erased ISB/context synchronization bodies
#   - asm/rv64_sail_test.go: the RV64 differential units under the Sail
#     RISC-V C emulator (the riscv/sail-riscv release binary)
#   - asm/rv64_qemu_test.go: the same units under QEMU
#   - asm/rv64_test.go: every RV64 mnemonic against GNU as
#   - asm/rv64_sail_bridge_test.go: the RV64 bridge's restated definitions
#     have not drifted from spec/lean/Oak/RiscV.lean
#   - rv64-bridge (second job): the Sail RISC-V model's Lean export is
#     generated from the pinned sail-riscv release, repaired by
#     spec/lean-sail/patch-export.py, built, and spec/lean-sail is proved
#     against it (the data semantics, the execute bodies, the encodings);
#     the export is cached by its pins, since generating it takes half an
#     hour and building it a few minutes more

on:
  push:
    branches:
      - specification
    paths:
      - 'asm/**'
      - 'spec/sail/**'
      - 'spec/lean/Oak/RiscV.lean'
      - 'spec/lean/Oak/ArmASL.lean'
      - 'spec/lean/Oak/AssemblerSemantics.lean'
      - 'spec/lean/Oak/AArch64Encoding.lean'
      - 'spec/lean/Oak/AArch64SysReg.lean'
      - 'spec/lean/Oak/AArch64ColdEntry.lean'
      - 'spec/lean-sail/**'
      - '.github/workflows/formal-sail.yml'
  pull_request:
    branches:
      - specification
  workflow_dispatch:

permissions:
  contents: read

env:
  SAIL_RELEASE: 0.20.2-binary
  SAIL_SHA256: 26b59bcab2d66e9f220d317dfe45f8b09170ed70e59a824553d6f525134d1ff6
  SAIL_RISCV_RELEASE: "0.14"
  SAIL_RISCV_SHA256: 363f851ba91c674cd818040e232c4baf0ec382406a0a9696b1dde687ea160b2a
  SAIL_ARM_COMMIT: 1bf2e5574ba9d704639a28401b6a387dcb113cae
  # The RV64 export needs Sail built from git (spec/lean-sail/README.md):
  # the 0.20.2 release's Lean backend predates the `LeanRV64D` namespace and
  # the lean-sail v5 pin that sail-riscv 0.14's hand-written RiscvExtras.lean
  # expects, so its export does not compile. sail-riscv's own Lean CI builds
  # Sail from source for the same reason.
  SAIL_GIT_COMMIT: dba5f0078f3a4c8d854ddda1d7ba5f59370c1d02
  OCAML_VERSION: 5.2.1
  # The sail-riscv commit whose Lean export compiles (spec/lean-sail/README.md,
  # Status): later models export vmem_types.sail with unbound `k_v`.
  SAIL_RISCV_COMMIT: 497209b9298bf11b040e000095fe24c51a598a1d

jobs:
  sail:
    name: Sail bridges and oracles
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the oracles' tools (RISC-V GNU tools, QEMU, llvm-mc)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf qemu-system-misc llvm
          llvm-mc --version | head -1
          riscv64-unknown-elf-gcc --version | head -1

      - name: Install the pinned Sail release
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/rems-project/sail/releases/download/${SAIL_RELEASE}/sail-Linux-x86_64.tar.gz" -o /tmp/sail.tar.gz
          echo "${SAIL_SHA256}  /tmp/sail.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sail.tar.gz -C "$HOME"
          echo "$HOME/sail/bin" >> "$GITHUB_PATH"
          # The release bundles the z3 Sail shells out to; within this step
          # PATH does not yet carry GITHUB_PATH, so name the directory.
          PATH="$HOME/sail/bin:$PATH" sail --version

      - name: Install the pinned Sail RISC-V emulator
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/riscv/sail-riscv/releases/download/${SAIL_RISCV_RELEASE}/sail-riscv-Linux-x86_64.tar.gz" -o /tmp/sail-riscv.tar.gz
          echo "${SAIL_RISCV_SHA256}  /tmp/sail-riscv.tar.gz" | sha256sum -c -
          mkdir -p external/sail-riscv/build/c_emulator
          tar -xzf /tmp/sail-riscv.tar.gz -C /tmp sail-riscv-Linux-x86_64/bin/sail_riscv_sim
          install -m 0755 /tmp/sail-riscv-Linux-x86_64/bin/sail_riscv_sim external/sail-riscv/build/c_emulator/sail_riscv_sim
          external/sail-riscv/build/c_emulator/sail_riscv_sim --version

      - name: Fetch Arm's pinned Sail model sources
        run: |
          set -euo pipefail
          git init -q external/sail-arm
          git -C external/sail-arm remote add origin https://github.com/rems-project/sail-arm.git
          git -C external/sail-arm sparse-checkout init --cone
          git -C external/sail-arm sparse-checkout set arm-v8.5-a/model
          git -C external/sail-arm fetch -q --depth 1 --filter=blob:none origin "${SAIL_ARM_COMMIT}"
          git -C external/sail-arm checkout -q FETCH_HEAD
          test -f external/sail-arm/arm-v8.5-a/model/aarch_decode.sail

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the Sail Lean support library at its pinned revision
        run: sh spec/sail/setup.sh

      - name: Build the Arm bridge (Sail-generated Lean ≡ Oak.ArmASL)
        working-directory: spec/sail/lean
        run: lake build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Run the oracle tests, every oracle required
        env:
          OAK_REQUIRE_ORACLES: "1"
        run: go test ./asm -run 'TestSailLeanGenerationCurrent|TestSailDecodeCoverage|TestSailArmBarrierDispatchSource|TestSailArmVMALLS12E1ISDispatchSource|TestSailArmDAIFSetDispatchSource|TestSailArmVTTBREL2WriteDispatchSource|TestSailArmHCREL2WriteDispatchSource|TestSailArmVTCREL2WriteDispatchSource|TestSailArmCNTHCTLEL2WriteDispatchSource|TestSailArmCNTVOFFEL2WriteDispatchSource|TestSailArmSPEL1WriteDispatchSource|TestSailArmELREL2WriteDispatchSource|TestSailArmSPSREL2WriteDispatchSource|TestSailArmPlainERETDispatchSource|TestColdEntryRegisterSequenceMatchesNativePrefix|TestSailColdEntryRegisterSequenceProjection|TestRV64SailDifferential|TestRV64QEMUDifferential|TestRV64EncoderAgreesWithGNUAs|TestRV64RVC|TestRV64Vector|TestRV64SailBridgeDefinitionsMatch' -count=1 -v

  rv64-bridge:
    name: RV64 bridge against the Sail export
    runs-on: ubuntu-24.04
    # Sail from source (~25 min) and the export (~90 min) on a cold cache;
    # minutes with both caches warm.
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the export's build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libgmp-dev zlib1g-dev python3 pkg-config opam z3

      # The opam switch holding Sail, keyed by the commit and the compiler.
      - name: Restore Sail built from git
        id: sail-cache
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: sail-git-${{ env.SAIL_GIT_COMMIT }}-ocaml-${{ env.OCAML_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build Sail from git
        if: steps.sail-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          opam init --yes --no-setup --bare --disable-sandboxing
          opam switch create sail-dev "ocaml-base-compiler.${OCAML_VERSION}" --yes
          git clone -q https://github.com/rems-project/sail.git /tmp/sail
          git -C /tmp/sail checkout -q "${SAIL_GIT_COMMIT}"
          # Every package pinned from the one checkout: libsail's build runs
          # `sail_maker embed`, so sail_maker must come from the same tree.
          opam pin add --switch sail-dev --no-action --yes /tmp/sail
          opam install --switch sail-dev --yes sail_maker libsail sail sail_lean_backend

      - name: Put Sail on PATH
        run: |
          set -euo pipefail
          echo "$HOME/.opam/sail-dev/bin" >> "$GITHUB_PATH"
          "$HOME/.opam/sail-dev/bin/sail" --version

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # The export, generated and built, keyed by everything that shapes it:
      # the Sail commit, the sail-riscv commit, and the bridge's lean-sail pin.
      - name: Restore the built export
        id: export-cache
        uses: actions/cache@v4
        with:
          path: external/sail-riscv/build/model/Lean_RV64D
          key: rv64-export-${{ env.SAIL_GIT_COMMIT }}-${{ env.SAIL_RISCV_COMMIT }}-${{ hashFiles('spec/lean-sail/lake-manifest.json', 'spec/lean-sail/lean-toolchain') }}

      - name: Generate and build the export
        if: steps.export-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git init -q external/sail-riscv
          git -C external/sail-riscv remote add origin https://github.com/riscv/sail-riscv.git
          git -C external/sail-riscv fetch -q --depth 1 origin "${SAIL_RISCV_COMMIT}"
          git -C external/sail-riscv checkout -q FETCH_HEAD
          cmake -S external/sail-riscv -B external/sail-riscv/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build external/sail-riscv/build --target generated_lean_rv64d
          cd external/sail-riscv/build/model/Lean_RV64D
          lake update
          lake build

      - name: Prove the bridge against the export
        working-directory: spec/lean-sail
        run: lake build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Run the bridge tests, the export required
        env:
          OAK_REQUIRE_ORACLES: "1"
        run: go test ./asm -run 'TestRV64SailBridge' -count=1 -v
