name: Invariant synthesis

on:
  pull_request:
    branches: [specification]
    paths:
      - 'prove/**'
      - 'prove*.go'
      - 'compiler/**'
      - 'asm/**'
      - 'evaluator/**'
      - 'typechecker/**'
      - 'parser/**'
      - 'ast/**'
      - 'examples/verification_synthesis.oak'
      - '.github/workflows/invariant-synthesis.yml'
  push:
    branches: [specification]
    paths:
      - 'prove/**'
      - 'prove*.go'
      - 'compiler/**'
      - 'asm/**'
      - 'evaluator/**'
      - 'typechecker/**'
      - 'parser/**'
      - 'ast/**'
      - 'examples/verification_synthesis.oak'
      - '.github/workflows/invariant-synthesis.yml'

jobs:
  synthesis:
    name: Checked invariant synthesis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Check synthesis acceptance and rejection paths
        run: go test -race -count=1 -timeout 10m ./prove . -run '^(TestSynthesis|TestProveSynthesis)'
      - name: Check synthesis formatting
        run: |
          gofmt -d prove/synthesis.go prove/synthesis_test.go prove_synthesis.go prove_synthesis_test.go
          test -z "$(gofmt -l prove/synthesis.go prove/synthesis_test.go prove_synthesis.go prove_synthesis_test.go)"
