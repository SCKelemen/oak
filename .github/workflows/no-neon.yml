name: Freestanding SIMD
on:
  pull_request:
    branches: [specification]
# Cancel only automatic PR runs; keep manual reruns and other events independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Require Clang
        run: clang --version
      - name: Check scalar and NEON target lowering
        run: go test ./codegen -run '^TestAArch64(SimdWithoutNeon|ExplicitVector)' -count=1
      - name: Verify golden output
        run: go test ./serialize -run TestGoldenCorpusMatches -count=1
      - name: Check formatting
        run: test -z "$(gofmt -l codegen/simd.go codegen/aarch64_no_neon_test.go)"
