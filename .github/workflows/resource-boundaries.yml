name: Resource boundary regressions

on:
  pull_request:
    branches: [ specification ]
    paths:
      - 'compiler/**'
      - 'typechecker/**'
      - 'borrowchecker/**'
      - 'resourceflow/**'
      - '.github/workflows/resource-boundaries.yml'

# Cancel only automatic PR runs; keep manual reruns and other events independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  resource-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Check resource and module boundaries
        run: go test -race -count=1 -timeout 10m ./compiler -run '^(TestE2E.*MultipleRegion|TestMultipleRegion|TestE2EModuleRegion|TestE2EBufferCustody|TestModuleRegion|TestResourceLoop|TestReassignment|TestMutableReborrow|TestObligation|TestCalleeAuthority|TestFunctionTypeContract)'
      - name: Check resource flow core
        run: go test -race -count=1 ./resourceflow
