name: Resource boundary regressions

on:
  pull_request:
    branches: [ specification ]
    paths:
      - 'compiler/**'
      - 'typechecker/**'
      - 'borrowchecker/**'
      - 'resourceflow/**'
      - '.github/workflows/resource-boundaries.yml'

jobs:
  resource-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Check resource and module boundaries
        run: go test -race -count=1 -timeout 10m ./compiler -run '^(TestE2EModuleRegion|TestModuleRegion|TestResourceLoop|TestReassignment|TestMutableReborrow|TestObligation|TestCalleeAuthority|TestFunctionTypeContract)'
      - name: Check resource flow core
        run: go test -race -count=1 ./resourceflow
