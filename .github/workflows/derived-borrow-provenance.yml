          \t\treturn false
          \t}
          \tend1, ok1 := regionEnd(r1)
          \tend2, ok2 := regionEnd(r2)
          \tif !ok1 || !ok2 {
          \t\treturn true
          \t}
          \treturn r1.Offset < end2 && r2.Offset < end1
          }'''.replace('          ', '')
