A derived writable span is a **reborrow**. While the child span is live, direct use of its parent span is suspended. When the child leaves its lexical scope, the parent becomes usable again. This preserves one usable writable authority along a parent/child chain without requiring lifetime syntax in ordinary Oak code.

Known slice/subslice bounds are translated into the same absolute owner coordinate space as their parent region. If the compiler cannot establish a precise derived region, it keeps the region unknown and fails closed for alias-disjointness decisions rather than inventing precision.

Bounds must be proved statically or checked dynamically in safe code. Out-of-range access is never undefined behavior.
'''
          text = replace_once(text, marker, replacement, 'borrowing spec')
          p.write_text(text)

          p = Path('docs/spec/STATUS.md')
          text = p.read_text()
          text = text.replace('`Oak.Borrowing` proves local read/write authority laws. `Oak.BorrowRegions` additionally proves half-open region symmetry/disjointness, adjacency, zero-length behavior, and conservative unknown-region conflict; compiler correspondence is not yet proved', '`Oak.Borrowing` proves local read/write authority laws. `Oak.BorrowRegions` proves half-open region symmetry/disjointness, adjacency, zero-length behavior, and conservative unknown-region conflict. Derived slices/subslices now retain exact absolute owner regions when statically known; writable children suspend their parent span until lexical release. `Oak.Reborrow` proves parent/child writable exclusivity and restoration; compiler correspondence is not yet proved')
          text = text.replace('`OAK-B0101`..`OAK-B0106` cover borrow reassignment, owner-use/write conflicts, view/span exclusivity, and writable-region overlap/unknown-disjointness.', '`OAK-B0101`..`OAK-B0107` cover borrow reassignment, owner-use/write conflicts, view/span exclusivity, writable-region overlap/unknown-disjointness, and use of a writable parent suspended by a reborrow.')
          text = text.replace('- `Oak.BorrowRegions`\n', '- `Oak.BorrowRegions`\n- `Oak.Reborrow`\n', 1)
          p.write_text(text)
          PY

      - name: Format Go
        run: gofmt -w borrowchecker/borrowchecker.go borrowchecker/diagnostics.go borrowchecker/derived_region.go borrowchecker/derived_borrow_test.go

      - name: Validate Go
        run: go test -race ./...

      - name: Validate Lean
        working-directory: spec/lean
        run: lake build

      - name: Remove one-shot workflow
        run: rm .github/workflows/derived-borrow-provenance.yml

      - name: Commit validated implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make derived borrows preserve provenance and writable authority"
          git push origin HEAD:feat/derived-borrow-provenance
