name: Derived Borrow Provenance

on:
  push:
    branches:
      - feat/derived-borrow-provenance
    paths:
      - .github/workflows/derived-borrow-provenance.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/derived-borrow-provenance
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1

      - name: Apply implementation
        run: python3 .github/scripts/apply_derived_borrow.py

      - name: Format Go
        run: gofmt -w borrowchecker/borrowchecker.go borrowchecker/diagnostics.go borrowchecker/derived_region.go borrowchecker/derived_borrow_test.go

      - name: Validate Go
        run: go test -race ./...

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Validate Lean
        working-directory: spec/lean
        run: lake build

      - name: Remove one-shot transport
        run: rm .github/workflows/derived-borrow-provenance.yml .github/scripts/apply_derived_borrow.py

      - name: Commit validated implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make derived borrows preserve provenance and writable authority"
          git push origin HEAD:feat/derived-borrow-provenance
