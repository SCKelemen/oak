name: Pattern Analysis Integration

on:
  push:
    branches:
      - feat/pattern-analysis
    paths:
      - .github/workflows/pattern-analysis-integrate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pattern-analysis
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1

      - name: Integrate pattern analysis
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('typechecker/typechecker.go')
          text = p.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
          '''\t// Type check each arm and collect types for lattice join
          \tarmTypes := []Type{}
          \tfor _, arm := range expr.Arms {'''.replace('          ', ''),
          '''\tanalysis := tc.analyzeMatch(expr, scrutineeType)
          \ttc.emitMatchAnalysisDiagnostics(expr, analysis)

          \t// Type check only reachable arms and collect their result types.
          \t// Redundant or refinement-impossible arms are semantically never and
          \t// must not widen the result type or create cascaded body errors.
          \tarmTypes := []Type{}
          \tfor armIndex, arm := range expr.Arms {'''.replace('          ', ''),
          'match loop')

          replace_once(
          '''\t\tpatternType := tc.checkPattern(arm.Pattern, scrutineeType)
          \t\tif patternType == nil {
          \t\t\ttc.env = oldEnv
          \t\t\tcontinue
          \t\t}

          \t\t// Type narrowing: use lattice narrowing'''.replace('          ', ''),
          '''\t\tpatternType := tc.checkPattern(arm.Pattern, scrutineeType)
          \t\tif patternType == nil {
          \t\t\ttc.env = oldEnv
          \t\t\tcontinue
          \t\t}
          \t\tif armIndex < len(analysis.Arms) && !analysis.Arms[armIndex].Reachable {
          \t\t\tarmTypes = append(armTypes, &NeverType{})
          \t\t\ttc.env = oldEnv
          \t\t\tcontinue
          \t\t}

          \t\t// Type narrowing: use lattice narrowing'''.replace('          ', ''),
          'unreachable arm skip')

          replace_once(
          '''\t// Check exhaustiveness for ADT types
          \tif adtType, ok := scrutineeType.(*ADTType); ok {
          \t\ttc.checkExhaustiveness(expr.Arms, adtType)
          \t}

          '''.replace('          ', ''),
          '',
          'legacy exhaustiveness call')

          replace_once(
          '''\tcase *ast.VariantPattern:
          \t\t// Check that variant belongs to expected ADT type
          \t\tif adtType, ok := expectedType.(*ADTType); ok {
          \t\t\t// Verify variant exists in ADT'''.replace('          ', ''),
          '''\tcase *ast.VariantPattern:
          \t\t// A nested match may see a scrutinee already refined by an outer
          \t\t// constructor arm. Validate against the parent ADT; coverage analysis
          \t\t// separately rejects constructors made impossible by that refinement.
          \t\tif narrowed, ok := expectedType.(*NarrowedADTVariantType); ok {
          \t\t\texpectedType = &ADTType{Name: narrowed.ADTName}
          \t\t}
          \t\t// Check that variant belongs to expected ADT type.
          \t\tif adtType, ok := expectedType.(*ADTType); ok {
          \t\t\tif p.TypeName != nil && p.TypeName.Value != adtType.Name {
          \t\t\t\ttc.addError(p.TypeName, "pattern constructor %s.%s does not belong to scrutinee type %s", p.TypeName.Value, p.Variant.Value, adtType.Name)
          \t\t\t\treturn nil
          \t\t\t}
          \t\t\t// Verify variant exists in ADT'''.replace('          ', ''),
          'narrowed pattern validation')

          marker = '// checkExhaustiveness verifies that a match expression covers all variants of an ADT\n'
          if text.count(marker) != 1:
              raise SystemExit('legacy checkExhaustiveness marker not unique')
          text = text[:text.index(marker)].rstrip() + '\n'
          p.write_text(text)
          PY

      - name: Format
        run: gofmt -w typechecker/typechecker.go typechecker/pattern_analysis.go typechecker/pattern_analysis_test.go typechecker/diagnostics.go

      - name: Validate typechecker
        run: go test -race ./typechecker

      - name: Validate repository
        run: go test -race ./...

      - name: Remove transport
        run: rm .github/workflows/pattern-analysis-integrate.yml

      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate structural pattern analysis into type checking'
          git push origin HEAD:feat/pattern-analysis
