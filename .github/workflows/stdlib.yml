name: Standard library
on:
  push:
    branches: [specification, codex/stdlib-foundation]
  pull_request:
    branches: [specification]
jobs:
  stdlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Test standard library and compiler
        run: go test ./compiler ./codegen ./typechecker ./borrowchecker
      - name: Check formatting
        run: |
          gofmt -d compiler/stdlib.go compiler/specialize.go compiler/e2e_stdlib_test.go stdlib/source.go
      - name: Build development artifacts
        if: always()
        run: |
          mkdir -p build
          go build -o build/oak .
          go test -c -o build/compiler.test ./compiler
          cp "$(go env GOROOT)/bin/gofmt" build/gofmt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oak-stdlib-development
          path: build/
          retention-days: 1
