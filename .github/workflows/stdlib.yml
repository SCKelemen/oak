name: Standard library
on:
  push:
    branches: [specification, codex/stdlib-foundation, codex/stdlib-bits-endian, codex/stdlib-buffers, codex/stdlib-collections, codex/stdlib-splice, codex/stdlib-heap]
  pull_request:
    branches: [specification]
jobs:
  stdlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Test standard library and compiler
        run: go test -race ./...
      - name: Check formatting
        if: always()
        run: |
          gofmt -d compiler/stdlib.go compiler/fluent.go compiler/syntax_walk.go compiler/e2e_stdlib_test.go compiler/e2e_stdlib_bits_endian_test.go compiler/e2e_stdlib_buffer_test.go compiler/e2e_stdlib_collections_test.go compiler/e2e_stdlib_splice_test.go compiler/e2e_stdlib_heap_test.go compiler/compilation.go stdlib/source.go codegen/codegen.go typechecker/typechecker.go typechecker/mono.go token/token.go lowering/lowering.go
