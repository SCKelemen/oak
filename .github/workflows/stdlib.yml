name: Standard library
on:
  push:
    branches: [specification, codex/stdlib-foundation, codex/stdlib-bits-endian, codex/stdlib-buffers, codex/stdlib-collections, codex/stdlib-splice, codex/stdlib-heap, codex/stdlib-serenity, codex/stdlib-strings, codex/borrow-storage, codex/runtime-strings, codex/json-codecs, codex/json-codecs-integration, codex/derived-json, codex/derived-json-integration, codex/decode-json, codex/decode-json-integration, codex/json-arrays, codex/json-options, codex/json-optimize, codex/json-speed, codex/json-gap]
  pull_request:
    branches: [specification]
jobs:
  stdlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Check generated Unicode tables
        run: |
          python3 stdlib/generate_unicode.py
          git diff --exit-code -- stdlib/unicode.oak
      - name: Test JSON fast paths
        run: go test ./compiler -run 'Test.*JsonFast' -count=1
      - name: Test nullable JSON codecs
        run: go test ./compiler -run 'Test.*JsonOption' -count=1
      - name: Test fixed array JSON codecs
        run: go test ./compiler -run 'Test.*JsonArray' -count=1
      - name: Test derived JSON decoding
        run: go test ./compiler -run 'Test.*JsonDecode' -count=1
      - name: Test derived JSON codecs
        run: go test ./compiler -run 'Test.*DerivedJson' -count=1
      - name: Test JSON codecs
        run: go test ./compiler -run 'Test.*JsonCodec' -count=1
      - name: Test borrow storage boundaries
        run: go test -race ./parser ./typechecker ./borrowchecker ./lsp -count=1
      - name: Check golden corpus
        run: go test ./serialize -run TestGoldenCorpusMatches -count=1
      - name: Test runtime string views
        run: go test ./compiler -run '(TestE2EStringViews|TestStringViews)' -count=1
      - name: Test strings
        run: go test ./compiler -run 'TestE2EStdlibText' -count=1
      - name: Test deque and ID pool
        run: go test ./compiler -run 'TestE2EStdlib(Deque|IdPool|Serenity)' -count=1
      - name: Test sort, varint, and random
        run: go test ./compiler -run 'TestE2EStdlib(SortAndSearch|SortMatchesGo|Varint|Random)|TestE2EGeneric(NestedTemplate|TemplateRecordLiteral)' -count=1
      - name: Test uuid
        run: go test ./compiler -run 'TestE2EStdlibUuid' -count=1
      - name: Test grapheme
        run: go test ./compiler -run 'TestE2EStdlibGrapheme' -count=1
      - name: Test float
        run: go test ./compiler -run 'TestE2EStdlibFloat' -count=1
      - name: Check Lean extraction of the standard library
        run: go test ./codegen/lean ./compiler -run 'TestExtraction|TestLeanStdlibExtract' -count=1
      - name: Test encoding codecs
        run: go test ./compiler -run 'TestE2EStdlibEncoding' -count=1
      - name: Test time
        run: go test ./compiler -run 'TestE2EStdlibTime' -count=1
      - name: Test time sources and simulated time
        run: go test ./compiler -run 'TestE2EStdlibTime(Source|Native)' -count=1 && go test ./testrunner -run 'TestTimesimExample' -count=1
      - name: Test url
        run: go test ./compiler -run 'TestE2EStdlibUrl' -count=1
      - name: Test path
        run: go test ./compiler -run 'TestE2EStdlibPath' -count=1
      # The whole compiler package runs under the race detector in ci.yml,
      # sharded; here the race run covers every other package plus the
      # compiler's standard-library and extraction tests.
      - name: Test standard library packages under the race detector
        run: |
          go test -race -timeout 45m $(go list ./... | grep -v '/compiler$')
          go test -race -timeout 45m ./compiler -run 'Stdlib|Lean|Hash|Text'
      - name: Check formatting
        if: always()
        run: |
          gofmt -d codegen/byte_pack.go compiler/e2e_json_fast_test.go compiler/e2e_json_option_test.go codegen/mono.go compiler/e2e_json_array_test.go compiler/codec_decode.go compiler/e2e_json_decode_test.go compiler/e2e_codec_type_arguments_test.go parser/parser.go compiler/codecs.go compiler/e2e_derived_json_test.go compiler/e2e_json_codec_test.go borrowchecker/simd_effects_test.go typechecker/ffi.go borrowchecker/global_effects.go lsp/position_index.go lsp/position_index_test.go typechecker/string_views.go borrowchecker/string_views.go borrowchecker/string_views_test.go codegen/string_views.go compiler/e2e_string_views_test.go typechecker/borrow_storage.go typechecker/borrow_storage_test.go borrowchecker/borrowchecker.go borrowchecker/escape.go borrowchecker/aggregate_escape_test.go borrowchecker/aggregate_storage.go borrowchecker/aggregate_storage_test.go compiler/stdlib.go compiler/text_literals.go compiler/e2e_stdlib_text_test.go codegen/slices.go compiler/fluent.go compiler/syntax_walk.go compiler/e2e_stdlib_test.go compiler/e2e_stdlib_bits_endian_test.go compiler/e2e_stdlib_buffer_test.go compiler/e2e_stdlib_collections_test.go compiler/e2e_stdlib_splice_test.go compiler/e2e_stdlib_heap_test.go compiler/e2e_stdlib_deque_id_test.go compiler/e2e_stdlib_encoding_test.go compiler/compilation.go stdlib/source.go codegen/codegen.go typechecker/typechecker.go typechecker/mono.go token/token.go lowering/lowering.go
