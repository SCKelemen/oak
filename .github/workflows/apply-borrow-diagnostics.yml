name: Apply Borrow Diagnostics Refactor

on:
  push:
    branches:
      - feat/borrow-diagnostics
    paths:
      - scripts/apply_borrow_diagnostics.py
      - .github/workflows/apply-borrow-diagnostics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/borrow-diagnostics
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1

      - name: Apply mechanical refactor
        run: python3 scripts/apply_borrow_diagnostics.py

      - name: Format
        run: gofmt -w borrowchecker/borrowchecker.go borrowchecker/diagnostics.go

      - name: Validate
        run: go test -race ./...

      - name: Remove one-shot transport
        run: rm scripts/apply_borrow_diagnostics.py .github/workflows/apply-borrow-diagnostics.yml

      - name: Commit validated refactor
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Migrate borrow conflicts to first-class diagnostics"
          git push origin HEAD:feat/borrow-diagnostics
