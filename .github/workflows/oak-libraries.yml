name: Oak libraries
on:
  push:
    branches: [codex/oak-library-ports]
  pull_request:
    branches: [specification]
# Cancel only automatic PR runs; keep manual reruns and other events independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Native Oak library models
        run: go test ./compiler -run '^TestE2EOakLibraries' -count=1
      - name: Check formatting
        run: test -z "$(gofmt -l stdlib/source.go compiler/e2e_oak_libraries_test.go)"
