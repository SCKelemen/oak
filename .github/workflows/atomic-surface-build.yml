name: Atomic Surface Integration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Apply compiler integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tools/atomic_surface_patch.py")
          s = p.read_text()
          marker = '''replace_once(
              "typechecker/typechecker.go",
              ''' + "'''" + '''func (tc *TypeChecker) checkInvocationExpression(expr *ast.InvocationExpression) Type {'''
          start = s.index(marker)
          end = s.index("\n\nreplace_once(", start)
          p.write_text(s[:start] + s[end + 2:])
          PY
          python3 tools/atomic_surface_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path("typechecker/typechecker.go")
          s = p.read_text()
          old = '''func (tc *TypeChecker) checkInvocationExpression(expr *ast.InvocationExpression) Type {
          \t// Compiler-known library calls: c conversions, misplaced c.extern, and
          \t// arm64 instruction functions (docs/spec/92-ffi.md).
          \tif libraryType, isLibrary := tc.checkLibraryInvocation(expr); isLibrary {
          \t\treturn libraryType
          \t}
          '''
          new = '''func (tc *TypeChecker) checkInvocationExpression(expr *ast.InvocationExpression) Type {
          \tif ident, ok := expr.Function.(*ast.Identifier); ok {
          \t\tif atomicType, recognized := tc.checkAtomicInvocation(ident.Value, expr); recognized {
          \t\t\treturn atomicType
          \t\t}
          \t}
          \t// Compiler-known library calls: c conversions, misplaced c.extern, and
          \t// arm64 instruction functions (docs/spec/92-ffi.md).
          \tif libraryType, isLibrary := tc.checkLibraryInvocation(expr); isLibrary {
          \t\treturn libraryType
          \t}
          '''
          if s.count(old) != 1:
              raise SystemExit(f"current checker invocation prelude count={s.count(old)}")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Format Go sources
        run: |
          gofmt -w semir/memory.go semir/memory_surface_test.go \
            typechecker/memory.go typechecker/memory_surface_test.go typechecker/gadt.go typechecker/typechecker.go \
            codegen/memory.go codegen/memory_e2e_test.go codegen/codegen.go codegen/memory_test.go \
            object/memory.go evaluator/memory.go evaluator/memory_test.go evaluator/evaluator.go \
            parser/memory_test.go

      - name: Test full Go implementation
        run: go test -race ./...

      - name: Commit integrated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm tools/atomic_surface_patch.py .github/workflows/atomic-surface-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "implement atomic source surface end to end"
          git push origin HEAD:feat/atomic-surface-e2e
