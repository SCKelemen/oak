name: CI

on:
  push:
    branches: [ main, master, specification ]
  pull_request:
    branches: [ main, master, specification ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: ['1.27.1']
        # The compiler package's end-to-end suite under the race detector
        # passed the 40-minute ceiling once the standard library grew; the
        # shards partition every test name exactly once (compiler E2E A-R,
        # the standard-library E2E tests in two halves (the text tests,
        # the rest), the remaining compiler E2E S-Z, the rest of compiler,
        # every other package). The S-Z shard alone reached the 45-minute
        # limit once TestE2EStd* passed eighty tests, and those alone did
        # too under the race detector on a slow runner.
        shard: [e2e-a-r, e2e-stdlib-text, e2e-stdlib-rest, e2e-s-z, compiler-rest, packages]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Verify dependencies
      run: go mod verify

    # The protocol tests model-check their generated TLA+ modules when a TLC
    # jar is present (compiler/e2e_protocol_array_test.go); give them one.
    - name: Set up Java for TLC
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Install TLC
      run: curl -fsSL -o /tmp/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar

    # Translation validation of the trusted core on rv64
    # (codegen/translation_validation_test.go) compiles the prelude helpers
    # with the RISC-V GNU toolchain and skips without it; the packages shard
    # is where that test runs, so give it the toolchain.
    - name: Install the RISC-V GNU toolchain (rv64 translation validation)
      if: matrix.shard == 'packages'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf
        riscv64-unknown-elf-gcc --version | head -1

    - name: Check nested array store regression
      run: go test -v ./compiler -run '^TestE2ENestedArrayFieldStores$' -count=1

    - name: Run tests
      env:
        OAK_TLA2TOOLS_JAR: /tmp/tla2tools.jar
        # The packages shard installed the RISC-V GNU toolchain above; the
        # rv64 translation validation must run there, not skip.
        OAK_REQUIRE_RV64_GCC: ${{ matrix.shard == 'packages' && '1' || '' }}
      run: |
        case "${{ matrix.shard }}" in
          e2e-a-r) go test -v -race -timeout 45m ./compiler -run '^TestE2E[A-R]' ;;
          e2e-stdlib-text) go test -v -race -timeout 60m ./compiler -run '^TestE2EStdlibT' ;;
          e2e-stdlib-rest) go test -v -race -timeout 60m ./compiler -run '^TestE2EStd(lib[^T]|[^l])' ;;
          e2e-s-z) go test -v -race -timeout 45m ./compiler -run '^TestE2E(S[^t]|St[^d]|[T-Z])' ;;
          compiler-rest) go test -v -race -timeout 45m ./compiler -run '^Test([^E]|E[^2]|E2[^E])' ;;
          packages) go test -v -race -timeout 45m $(go list ./... | grep -v '/compiler$') ;;
        esac

  cross-targets:
    name: Cross targets (zig)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.1'

    - name: Set up Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.15.1

    - name: Install QEMU (system emulators for the microcontroller targets, user-mode for cross runs)
      run: sudo apt-get update && sudo apt-get install -y qemu-system-arm qemu-system-misc qemu-user-static

    - name: Cross-build every Linux target, run them under user-mode QEMU, and run the microcontroller targets
      run: go test -v ./target ./toolchain ./compiler -run '^Test(ParseAndEnv|Spellings|ResolveOrder|ResolveEmulator|Cross|E2EMicrocontroller|E2ERVV|E2ESVE|E2ENativeRV64|E2ENativeExecutable)'

  riscv64-memory-refinement:
    name: RISC-V Memory Refinement
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.1'

    - name: Verify Clang riscv64 cross-target support
      run: |
        clang --version
        clang --target=riscv64-unknown-none-elf -march=rv64gc -ffreestanding -x c -S -o /tmp/oak-riscv64-smoke.s - <<'EOF'
        _Atomic(unsigned long long) oak_atomic_smoke;
        EOF

    - name: Verify RV64 atomic lowering
      env:
        OAK_REQUIRE_RISCV64_CLANG: '1'
      run: go test -v ./codegen -run '^TestRISCV64'

  aarch64-memory-refinement:
    name: AArch64 Memory Refinement
    runs-on: ubuntu-24.04

    timeout-minutes: 90
    env:
      HERDTOOLS7_COMMIT: 76d5bd259d4c4b553a0f52158b9638559b79a5b5
      HERDTOOLS7_OCAML: 5.2.1

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.1'

    - name: Install Herd build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends opam

    - name: Fetch Arm's official model at the recorded revision
      run: |
        set -euo pipefail
        recorded="$(cat spec/litmus/aarch64/HERDTOOLS7_COMMIT)"
        test "${#recorded}" -eq 40
        case "$recorded" in *[!0-9a-f]*) exit 1 ;; esac
        test "$recorded" = "$HERDTOOLS7_COMMIT"
        git init -q external/herdtools7
        git -C external/herdtools7 remote add origin https://github.com/herd/herdtools7.git
        git -C external/herdtools7 fetch -q --depth 1 --filter=blob:none origin "$HERDTOOLS7_COMMIT"
        git -C external/herdtools7 checkout -q FETCH_HEAD
        test "$(git -C external/herdtools7 rev-parse HEAD)" = "$HERDTOOLS7_COMMIT"

    - name: Restore pinned Herd build
      id: herd-cache
      uses: actions/cache@v4
      with:
        path: ~/.opam
        key: herdtools7-${{ env.HERDTOOLS7_COMMIT }}-ocaml-${{ env.HERDTOOLS7_OCAML }}-${{ runner.os }}-${{ runner.arch }}

    - name: Build pinned Herd
      if: steps.herd-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        opam init --yes --no-setup --bare --disable-sandboxing
        opam switch create herdtools7 "ocaml-base-compiler.${HERDTOOLS7_OCAML}" --yes
        opam install --switch herdtools7 --yes dune
        cd external/herdtools7
        opam exec --switch herdtools7 -- dune build asllib/aslref.opam
        cd ../..
        opam pin add --switch herdtools7 --no-action --yes aslref ./external/herdtools7/asllib
        opam install --switch herdtools7 --yes aslref
        opam pin add --switch herdtools7 --no-action --yes herdtools7 ./external/herdtools7
        opam install --switch herdtools7 --yes herdtools7

    - name: Put pinned Herd on PATH
      run: |
        test -x "$HOME/.opam/herdtools7/bin/herd7"
        echo "$HOME/.opam/herdtools7/bin" >> "$GITHUB_PATH"
        "$HOME/.opam/herdtools7/bin/herd7" --version

    - name: Verify Clang cross-target support
      run: |
        clang --version
        clang --target=aarch64-none-elf -ffreestanding -x c -S -o /tmp/oak-aarch64-smoke.s - <<'EOF'
        _Atomic(unsigned long long) oak_atomic_smoke;
        EOF

    - name: Verify AArch64 atomic lowering
      env:
        OAK_REQUIRE_AARCH64_CLANG: '1'
      run: go test -v ./codegen -run '^TestAArch64'

    - name: Verify memory-model litmus outcomes
      env:
        OAK_REQUIRE_HERD7: '1'
        OAK_HERDTOOLS7_DIR: ${{ github.workspace }}/external/herdtools7
      run: go test -v ./semir -run '^TestLitmus'
