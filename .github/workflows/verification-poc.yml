name: Verification experiment (opt-in)

on:
  workflow_dispatch:
  push:
    branches: [specification]

permissions:
  contents: read

# Commit-message opt-in also works before this workflow reaches the default
# branch. Ordinary pushes create skipped jobs and install/run no solvers.
jobs:
  soundness:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-poc]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Install pinned Lean
        run: bash experiments/verification-poc/ci/install-tools.sh lean
      - name: Check abstract and executable RUP/deletion soundness
        working-directory: experiments/verification-poc
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/soundness
          lean --version | tee build/soundness/tool-version.txt
          export LEAN_PATH="$PWD/proof"
          lean -DwarningAsError=true -o proof/RUPSoundness.olean proof/RUPSoundness.lean 2>&1 | tee build/soundness/lean.log
          lean -DwarningAsError=true -o proof/RUPExecutable.olean proof/RUPExecutable.lean 2>&1 | tee build/soundness/executable.log
          lean -DwarningAsError=true -o proof/RUPText.olean proof/RUPText.lean 2>&1 | tee build/soundness/text.log
      - name: Prove bounded decimal and scanner state models
        working-directory: experiments/verification-poc
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH="$PWD/proof"
          lean -DwarningAsError=true -o proof/BoundedDecimal.olean proof/BoundedDecimal.lean 2>&1 | tee build/soundness/bounded-decimal-proof.log
          lean -DwarningAsError=true -o proof/ScannerState.olean proof/ScannerState.lean 2>&1 | tee build/soundness/scanner-proof.log
          lean -DwarningAsError=true -o proof/PackedBuffers.olean proof/PackedBuffers.lean 2>&1 | tee build/soundness/packed-buffers-proof.log
          lean -DwarningAsError=true -o proof/RangeBridge.olean proof/RangeBridge.lean 2>&1 | tee build/soundness/range-bridge-proof.log
          lean -DwarningAsError=true -o proof/LiveTable.olean proof/LiveTable.lean 2>&1 | tee build/soundness/live-table-proof.log
          lean -DwarningAsError=true -o proof/PropagationState.olean proof/PropagationState.lean 2>&1 | tee build/soundness/propagation-proof.log
          lean -DwarningAsError=true -o proof/ClauseClassifier.olean proof/ClauseClassifier.lean 2>&1 | tee build/soundness/classifier-proof.log
          lean -DwarningAsError=true -o proof/PropagationChain.olean proof/PropagationChain.lean 2>&1 | tee build/soundness/chain-proof.log
          lean -DwarningAsError=true -o proof/CertifiedStream.olean proof/CertifiedStream.lean 2>&1 | tee build/soundness/certified-stream-proof.log
          lean -DwarningAsError=true -o proof/InitialDecoder.olean proof/InitialDecoder.lean 2>&1 | tee build/soundness/initial-decoder-proof.log
          lean -DwarningAsError=true -o proof/ProofPacking.olean proof/ProofPacking.lean 2>&1 | tee build/soundness/proof-packing.log
          lean -DwarningAsError=true -o proof/SegmentPublication.olean proof/SegmentPublication.lean 2>&1 | tee build/soundness/segment-publication-proof.log
          lean -DwarningAsError=true proof/SegmentPublicationCompare.lean
          lean -DwarningAsError=true -o proof/CommandAssembly.olean proof/CommandAssembly.lean 2>&1 | tee build/soundness/command-assembly-proof.log
          lean -DwarningAsError=true proof/CommandAssemblyCompare.lean
          lean -DwarningAsError=true -o proof/CertificateFile.olean proof/CertificateFile.lean 2>&1 | tee build/soundness/certificate-file-proof.log
          lean -DwarningAsError=true proof/CertificateFileCompare.lean
          lean -DwarningAsError=true -o proof/OakText.olean proof/OakText.lean 2>&1 | tee build/soundness/oak-text-proof.log
          lean -DwarningAsError=true -o proof/OakTextExtracted.olean proof/OakTextExtracted.lean 2>&1 | tee build/soundness/oak-text-extracted.log
          lean -DwarningAsError=true proof/OakTextCompare.lean
          lean -DwarningAsError=true -o proof/OakTextRefinement.olean proof/OakTextRefinement.lean 2>&1 | tee build/soundness/oak-text-refinement-proof.log
          lean -DwarningAsError=true -o proof/PackedText.olean proof/PackedText.lean 2>&1 | tee build/soundness/packed-text-proof.log
          lean -DwarningAsError=true proof/CertificateReplay.lean
      - name: Compare Go and Lean checker decisions
        working-directory: experiments/verification-poc
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH="$PWD/proof"
          export OAK_LEAN_DIFFERENTIAL_OUT="$PWD/build/soundness/cases.json"
          export OAK_LEAN_TEXT_CORPUS_OUT="$PWD/build/soundness/text-cases.json"
          go test -count=1 -v ./internal/lrat -run '^TestLeanDifferentialCorpus$' 2>&1 | tee build/soundness/go-corpus.log
          lean -DwarningAsError=true --run proof/RUPCompare.lean "$OAK_LEAN_DIFFERENTIAL_OUT" 2>&1 | tee build/soundness/agreement.log
          lean -DwarningAsError=true --run proof/RUPTextCompare.lean "$OAK_LEAN_TEXT_CORPUS_OUT" 2>&1 | tee build/soundness/text-agreement.log
      - name: Prove Boolean CNF encoding and compare with Go
        working-directory: experiments/verification-poc
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH="$PWD/proof"
          lean -DwarningAsError=true -o proof/BooleanCNF.olean proof/BooleanCNF.lean 2>&1 | tee build/soundness/boolean-cnf.log
          lean -DwarningAsError=true -o proof/NumberedCNF.olean proof/NumberedCNF.lean 2>&1 | tee build/soundness/numbered-cnf.log
          lean -DwarningAsError=true -o proof/BooleanSafety.olean proof/BooleanSafety.lean 2>&1 | tee build/soundness/boolean-safety.log
          lean -DwarningAsError=true -o proof/BooleanModel.olean proof/BooleanModel.lean 2>&1 | tee build/soundness/boolean-model.log
          lean -DwarningAsError=true proof/BooleanModelAxioms.lean 2>&1 | tee build/soundness/boolean-model-axioms.log
          export OAK_BOOLEAN_CNF_CORPUS_OUT="$PWD/build/soundness/boolean-cnf-cases.json"
          go test -count=1 -v . -run '^TestBooleanCNFSpecification$' 2>&1 | tee build/soundness/boolean-cnf-go.log
          lean -DwarningAsError=true --run proof/BooleanCNFCompare.lean "$OAK_BOOLEAN_CNF_CORPUS_OUT" 2>&1 | tee build/soundness/boolean-cnf-agreement.log
          export OAK_SELF_HOSTED_RUP_CORPUS_OUT="$PWD/build/soundness/self-hosted-rup-cases.json"
          go test -count=1 -v . -run '^TestSelfHostedRUPKernel$' 2>&1 | tee build/soundness/self-hosted-rup-go.log
          lean -DwarningAsError=true --run proof/SelfHostedRUPCompare.lean "$OAK_SELF_HOSTED_RUP_CORPUS_OUT" 2>&1 | tee build/soundness/self-hosted-rup-agreement.log
          export OAK_SELF_HOSTED_STREAM_CORPUS_OUT="$PWD/build/soundness/self-hosted-stream-cases.json"
          go test -count=1 -v . -run '^TestSelfHostedProofStreams$' 2>&1 | tee build/soundness/self-hosted-stream-go.log
          lean -DwarningAsError=true --run proof/RUPCompare.lean "$OAK_SELF_HOSTED_STREAM_CORPUS_OUT" 2>&1 | tee build/soundness/self-hosted-stream-agreement.log
          lean -DwarningAsError=true --run proof/ProofPackingCompare.lean "$OAK_SELF_HOSTED_STREAM_CORPUS_OUT" 2>&1 | tee build/soundness/proof-packing-agreement.log
          export OAK_SELF_HOSTED_TEXT_CORPUS_OUT="$PWD/build/soundness/self-hosted-text-cases.json"
          export OAK_SELF_HOSTED_TEXT_PROFILE_OUT="$PWD/build/soundness/self-hosted-text-profile-cases.json"
          go test -count=1 -v . -run '^TestSelfHostedText$|^TestSelfHostedTextProfile$|^TestLeanExtractionMatchesCommitted$' 2>&1 | tee build/soundness/self-hosted-text-go.log
          lean -DwarningAsError=true --run proof/RUPTextCompare.lean "$OAK_SELF_HOSTED_TEXT_CORPUS_OUT" 2>&1 | tee build/soundness/self-hosted-text-agreement.log
          lean -DwarningAsError=true --run proof/CertificateFileCompare.lean "$OAK_SELF_HOSTED_TEXT_CORPUS_OUT" "$OAK_SELF_HOSTED_TEXT_PROFILE_OUT" 2>&1 | tee build/soundness/certificate-file-agreement.log
          lean -DwarningAsError=true --run proof/OakTextCompare.lean "$OAK_SELF_HOSTED_TEXT_CORPUS_OUT" "$OAK_SELF_HOSTED_TEXT_PROFILE_OUT" 2>&1 | tee build/soundness/oak-text-agreement.log
      - name: Compare bounded decimal parsing with Oak
        working-directory: experiments/verification-poc
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH="$PWD/proof"
          export OAK_DECIMAL_CORPUS_OUT="$PWD/build/soundness/decimal-cases.json"
          go test -count=1 -v . -run '^TestSelfHostedDecimal$' 2>&1 | tee build/soundness/decimal-go.log
          lean -DwarningAsError=true --run proof/BoundedDecimalCompare.lean "$OAK_DECIMAL_CORPUS_OUT" 2>&1 | tee build/soundness/decimal-agreement.log
      - name: Compare all scanner output fields
        working-directory: experiments/verification-poc
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH="$PWD/proof"
          export OAK_SCANNER_CORPUS_OUT="$PWD/build/soundness/scanner-cases.json"
          go test -count=1 -v . -run '^TestScannerOracle$|^TestSelfHostedScanner$' 2>&1 | tee build/soundness/scanner-go.log
          lean -DwarningAsError=true --run proof/ScannerStateCompare.lean "$OAK_SCANNER_CORPUS_OUT" 2>&1 | tee build/soundness/scanner-agreement.log
      - name: Compare decoded clause and hint buffer layouts
        working-directory: experiments/verification-poc
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH="$PWD/proof"
          export OAK_BUFFER_CORPUS_OUT="$PWD/build/soundness/buffer-cases.json"
          go test -count=1 -v . -run '^TestSelfHostedBufferLayouts$' 2>&1 | tee build/soundness/buffers-go.log
          lean -DwarningAsError=true --run proof/PackedBuffersCompare.lean "$OAK_BUFFER_CORPUS_OUT" 2>&1 | tee build/soundness/buffers-agreement.log
          lean -DwarningAsError=true --run proof/SegmentPublicationCompare.lean "$OAK_BUFFER_CORPUS_OUT" 2>&1 | tee build/soundness/segment-publication-agreement.log
          export OAK_ASSEMBLY_CORPUS_OUT="$PWD/build/soundness/assembly-cases.json"
          go test -count=1 -v . -run '^TestSelfHostedCommandAssembly$' 2>&1 | tee build/soundness/assembly-go.log
          lean -DwarningAsError=true --run proof/CommandAssemblyCompare.lean "$OAK_ASSEMBLY_CORPUS_OUT" 2>&1 | tee build/soundness/command-assembly-agreement.log
      - name: Compare range decoding and proof-stream semantics
        working-directory: experiments/verification-poc
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH="$PWD/proof"
          export OAK_RANGE_CORPUS_OUT="$PWD/build/soundness/range-cases.json"
          go test -count=1 -v . -run '^TestSelfHostedRangeBridge$' 2>&1 | tee build/soundness/ranges-go.log
          lean -DwarningAsError=true --run proof/RangeBridgeCompare.lean "$OAK_RANGE_CORPUS_OUT" 2>&1 | tee build/soundness/ranges-agreement.log
          export OAK_TABLE_CORPUS_OUT="$PWD/build/soundness/table-cases.json"
          go test -count=1 -v . -run '^TestSelfHostedLiveTable$' 2>&1 | tee build/soundness/table-go.log
          lean -DwarningAsError=true --run proof/LiveTableCompare.lean "$OAK_TABLE_CORPUS_OUT" 2>&1 | tee build/soundness/table-agreement.log
          export OAK_PROPAGATION_CORPUS_OUT="$PWD/build/soundness/propagation-cases.json"
          go test -count=1 -v . -run '^TestSelfHostedPropagationState$' 2>&1 | tee build/soundness/propagation-go.log
          lean -DwarningAsError=true --run proof/PropagationStateCompare.lean "$OAK_PROPAGATION_CORPUS_OUT" 2>&1 | tee build/soundness/propagation-agreement.log
          export OAK_CLASSIFIER_CORPUS_OUT="$PWD/build/soundness/classifier-cases.json"
          go test -count=1 -v . -run '^TestSelfHostedClauseClassifier$' 2>&1 | tee build/soundness/classifier-go.log
          lean -DwarningAsError=true --run proof/ClauseClassifierCompare.lean "$OAK_CLASSIFIER_CORPUS_OUT" 2>&1 | tee build/soundness/classifier-agreement.log
          export OAK_CHAIN_CORPUS_OUT="$PWD/build/soundness/chain-cases.json"
          go test -count=1 -v . -run '^TestSelfHostedPropagationChain$' 2>&1 | tee build/soundness/chain-go.log
          lean -DwarningAsError=true --run proof/PropagationChainCompare.lean "$OAK_CHAIN_CORPUS_OUT" 2>&1 | tee build/soundness/chain-agreement.log
          export OAK_CERTIFIED_STREAM_CORPUS_OUT="$PWD/build/soundness/certified-stream-cases.json"
          go test -count=1 -v . -run '^TestSelfHostedCertifiedStream$' 2>&1 | tee build/soundness/certified-stream-go.log
          lean -DwarningAsError=true --run proof/CertifiedStreamCompare.lean "$OAK_CERTIFIED_STREAM_CORPUS_OUT" 2>&1 | tee build/soundness/certified-stream-agreement.log
      - name: Retain proof and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-soundness-${{ github.sha }}
          path: |
            experiments/verification-poc/proof/
            experiments/verification-poc/build/soundness/
          retention-days: 30
  solvers:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-poc]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned backends
        run: bash experiments/verification-poc/ci/install-tools.sh all
      - name: Check native experiment and publication correspondence
        working-directory: experiments/verification-poc
        run: go test -v -race ./...
      - name: Run external verification suite
        working-directory: experiments/verification-poc
        shell: bash
        run: |
          set -euo pipefail
          go build -o build/oak-verify .
          ./build/oak-verify suite --timeout 120 --tla-jar "$PWD/build/tools/tla2tools.jar" --out build/integration
      - name: Independently recheck actual certificates with Lean
        working-directory: experiments/verification-poc
        run: bash ci/check-certificates.sh
      - name: Check expression-to-proof bridge with real certificates
        working-directory: experiments/verification-poc
        run: bash ci/check-boolean-proofs.sh
      - name: Check Boolean invariant certificates from Oak projects
        working-directory: experiments/verification-poc
        run: bash ci/check-boolean-models.sh
      - name: Retain models, solver logs, certificates and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-solvers-${{ github.sha }}
          path: |
            experiments/verification-poc/build/integration/
            experiments/verification-poc/build/lean-gate/
            experiments/verification-poc/build/boolean-proofs/
            experiments/verification-poc/build/boolean-models/
            experiments/verification-poc/build/tools/provenance.json
            experiments/verification-poc/tools.lock.json
          retention-days: 30

