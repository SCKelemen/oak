name: Formal Verification

on:
  push:
    branches:
      - specification
      - docs/spec-consolidation
      - codex/lrat-bound-soundness
  pull_request:
    branches:
      - specification

permissions:
  contents: read

# Cancel only automatic PR runs; keep manual reruns and other events independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  sat-model:
    name: SAT model soundness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Run independently of the full specification: an unrelated proof
      # failure must not hide the production checker and its theorem contract.
      - name: Build production SAT-model soundness
        working-directory: spec/lean
        run: lake build Oak.SATModelSoundness

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Check self-hosted SAT-model admission, extraction, and soundness
        env:
          OAK_REQUIRE_SAT_MODEL_LEAN: '1'
        run: go test . -run '^TestOakSATModel' -count=1 -timeout=10m -v

  lrat-kernel:
    name: LRAT kernel soundness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Track the complete LRAT proof independently of unrelated formal modules.
      - name: Build production LRAT bound-record proof
        working-directory: spec/lean
        run: lake build Oak.LRATAdmission

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Check production LRAT records, extraction, and scratch restoration
        env:
          OAK_REQUIRE_LRAT_TRAIL_LEAN: '1'
          OAK_REQUIRE_LRAT_RECORD_LEAN: '1'
        run: go test ./compiler -run '^TestLRATKernel' -count=1 -timeout=10m -v

      - name: Check exact formula binding and concrete soundness
        env:
          OAK_REQUIRE_LRAT_BINDING_LEAN: '1'
        run: go test . -run '^(TestLRATFormulaBinding|TestOakLRATFormulaBinding|TestLRATFormulaBindingMatchesLean)$' -count=1 -timeout=10m -v

  lean:
    # Proof-branch iterations use the dedicated gates above. PR and
    # specification runs still check the complete formal specification.
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/codex/lrat-')
    name: Lean 4
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check RV64 encoding, layout, and execution proofs
        working-directory: spec/lean
        run: lake build Oak.RiscVBranchEncoding Oak.RiscVCompressedBranchEncoding Oak.RiscVRelaxation Oak.RiscVMaterialization Oak.RiscVCallExecution Oak.RiscVDirectControl Oak.RiscVControlFlow Oak.RiscVComparison

      - name: Build formal specification
        working-directory: spec/lean
        run: lake build

      - name: Audit session obligations and aggregate admissions
        working-directory: spec/lean
        run: lake env lean CheckSessionObligations.lean

      - name: Check unsigned strength reduction boundaries and proof authority
        working-directory: spec/lean
        run: lake env lean CheckStrengthReduction.lean

      # The standard-library extractions are checked for faithfulness by
      # running the extracted Lean and the compiled Oak on one corpus and
      # comparing byte for byte (docs/spec/95-extraction.md section 6).
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Check REPL obligation generation and proof trust verdicts
        run: go test ./repl -run 'TestLean|TestClassify' -count=1 -timeout=10m -v

      # Production AArch64 relocation and CNF allocation/clause/replay decisions are
      # rendered as Lean examples and checked against their models in this
      # Lean-equipped lane. Ordinary Go-only jobs skip these optional oracles.
      - name: Check bounded production correspondence
        run: go test ./asm -run 'TestAArch64Branch26RelocationMatchesLean|TestAArch64ADRL21PatchBoundaries|TestRV64PCRelMatchesLean|TestValidateCNFAllocationMatchesLean|TestValidateCNFTraceMatchesLean|TestNativeCNFReplay(Apply|Term|Word|WordPairs|Header|Finish|Settled|MetadataSettled|Recording)MatchesLean|TestNativeCNFReplayWordProjection' -count=1 -v

      - name: Check ARM64 bitwise emitted bytes against Lean
        env:
          OAK_REQUIRE_ARM64_LEAN: '1'
        run: go test ./asm -run '^TestAArch64BitwiseFunction' -count=1 -v

      - name: Check ARM64 compiler ELF startup against Lean
        env:
          OAK_REQUIRE_ARM64_LEAN: '1'
        run: go test ./compiler -run '^TestAArch64MinimalStartupMatchesLean$' -count=1 -v

      - name: Check Wasm assembler production decisions against Lean
        env:
          OAK_REQUIRE_WASM_LEAN: '1'
        run: go test ./wasm/encoding -run '^TestWasmEncodingMatchesLean$' -count=1 -v

      - name: Check Oak Wasm assembler extraction and correspondence
        env:
          OAK_REQUIRE_WASM_LEAN: '1'
        run: go test ./compiler -run '^TestLeanWasmAssembler(Extract|Faithful)$' -count=1 -timeout=20m -v

      - name: Set up independent Wasm engine
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Oak Wasm assembler and execute its output
        env:
          OAK_REQUIRE_WASM_TESTS: '1'
        run: go test ./compiler -run '^TestE2ESelfHostedWasm' -count=1 -v

      - name: Check decoded Wasm execution against Lean and independent engine
        env:
          OAK_REQUIRE_WASM_LEAN: '1'
          OAK_REQUIRE_WASM_TESTS: '1'
        run: go test ./compiler -run '^TestWasm(Execution|Control|Calls|Module|Typing|CallComposition)(Lean|Engine)$' -count=1 -timeout=20m -v

      - name: Prepare complete pinned official Wasm numeric sources
        run: python3 -B spec/wasm-core/numeric_sources.py --fetch

      - name: Check official Wasm numeric source provenance controls
        run: python3 -B spec/wasm-core/test_numeric_sources.py

      - name: Check actual source and compiled Wasm modules against source-checked numeric Core
        env:
          OAK_REQUIRE_WASM_LEAN: '1'
        run: go test ./compiler -run '^TestWasmCore' -count=1 -timeout=45m -v

      - name: Check official Wasm numeric semantic rejection controls
        working-directory: spec/lean
        run: lake env lean ../wasm-core/NumericControls.lean

      - name: Audit restricted Wasm Core theorem axioms
        run: python3 spec/wasm-core/audit.py

      - name: Check Wasm LEB production decisions against Lean
        env:
          OAK_REQUIRE_WASM_LEAN: '1'
        run: go test ./wasm/check -run '^TestWasmLEBMatchesLean$' -count=1 -v

      - name: Check compiled Oak linker placement against Lean
        env:
          OAK_REQUIRE_LINKER_LEAN: '1'
        run: go test ./compiler -run '^TestE2ESelfHostedPlacement$' -count=1 -v

      - name: Check RV64 selector comparison and routing certificates
        env:
          OAK_REQUIRE_RV64_LEAN: '1'
        run: go test ./machine -run '^TestRV64(ControlFlow|Comparison)Selector' -count=1 -v

      - name: Check RV64 production decisions against Lean
        env:
          OAK_REQUIRE_RV64_LEAN: '1'
        run: go test ./asm -run '^TestRV64((LocalBranches|CompressedBranches)MatchLean|(Relaxation|Materialization|CallExecution|DirectControl|BitwiseFunction|BitwiseELF)MatchesLean)$' -count=1 -v

      - name: Check RV64 compiler bitwise bytes against Lean
        env:
          OAK_REQUIRE_RV64_LEAN: '1'
        run: go test ./compiler -run '^TestRV64FramedBitwiseCompilerMatchesLean$' -count=1 -v

      - name: Check solver formula binding in Go, Oak, and Lean
        env:
          OAK_REQUIRE_LRAT_BINDING_LEAN: '1'
        run: go test . -run '^(TestLRATFormulaBinding|TestOakLRATFormulaBinding|TestLRATFormulaBindingMatchesLean)$' -count=1 -v

      - name: Check clause-engine agreement policy against Lean
        env:
          OAK_REQUIRE_CLAUSE_AGREEMENT_LEAN: '1'
        run: go test . -run '^TestClauseAgreement' -count=1 -v

      - name: Check extracted standard library against compiled and interpreted Oak
        env:
          OAK_REQUIRE_TIME_LEAN: '1'
        run: go test ./compiler -run '^Test(LeanStdlibFaithful|LeanTimeCalendarFaithful|LeanTimeCodecFaithful)$' -count=1 -timeout=20m -v

      - name: Check self-hosted LRAT kernel and production extraction
        run: go test ./compiler -run '^TestLRATKernel' -count=1 -v

      - name: Check LRAT allocating entries and failure cleanup
        run: go test . -run '^TestOakLRAT(AllocatedEntry|RawStreamEntry)$' -count=1 -v

      # The self-hosted laws (docs/spec/125-verification.md section 7): the
      # decided files everywhere, the Lean-proved file here, where the
      # toolchain is installed.
      - name: Prove the self-hosted laws
        run: go test . -run 'TestSelfHostedLaws' -count=1 -v
