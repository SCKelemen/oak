name: Restore pay-for-use never carrier

on:
  push:
    branches:
      - feat/el2-cold-enter

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/el2-cold-enter
          fetch-depth: 0
      - name: Restore pay-for-use carrier
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('codegen/codegen.go')
          s = p.read_text()
          line = '\tcg.write("typedef u8 oak_never; /* backend carrier for uninhabited Oak bottom type */\\n")\n'
          if s.count(line) != 1:
              raise SystemExit(f'global never typedef count = {s.count(line)}, want 1')
          p.write_text(s.replace(line, '', 1))

          p = Path('codegen/eret.go')
          s = p.read_text()
          old = 'arm64HelperSources[member] = `__attribute__((noreturn)) static inline oak_never oak_arm64_eret( void ) {'
          new = 'arm64HelperSources[member] = `typedef u8 oak_never; /* uninhabited Oak bottom carrier; ERET never produces it */\n__attribute__((noreturn)) static inline oak_never oak_arm64_eret( void ) {'
          if s.count(old) != 1:
              raise SystemExit(f'ERET helper anchor count = {s.count(old)}, want 1')
          p.write_text(s.replace(old, new, 1))

          Path('.github/workflows/patch-never-pay-for-use.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codegen/codegen.go codegen/eret.go .github/workflows/patch-never-pay-for-use.yml
          git commit -m "keep never backend carrier pay for use"
          git push origin HEAD:feat/el2-cold-enter
