name: Standard library benchmark smoke
on:
  push:
    branches: [specification]
    paths: ['benchmarks/stdlib/**', '.github/workflows/stdlib-benchmark.yml', 'compiler/**', 'codegen/**', 'stdlib/**']
  pull_request:
    branches: [specification]
    paths: ['benchmarks/stdlib/**', '.github/workflows/stdlib-benchmark.yml', 'compiler/**', 'codegen/**', 'stdlib/**']
  workflow_dispatch:
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      # Correctness first: every Oak workload under ASan/UBSan with its
      # checksum compared against the Go reference. Not a timing result.
      - name: Sanitizer correctness
        run: python3 benchmarks/stdlib/run.py --sanitize --scale 0.02 --samples 1 --output benchmark-results/sanitizer.json
      # Release timing on a shared runner: numbers are indicative only and
      # never gate a merge; the artifact keeps raw samples and metadata.
      - name: Release timing smoke
        run: python3 benchmarks/stdlib/run.py --scale 0.25 --samples 5 --output benchmark-results/release.json --inspect benchmark-results/generated-c
      - uses: actions/upload-artifact@v4
        with:
          name: stdlib-benchmark-${{ matrix.os }}
          path: benchmark-results/
