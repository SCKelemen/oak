name: Finalize Source Delimited Allocation Pass

on:
  push:
    branches:
      - feat/source-delimited-alloc-model

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/source-delimited-alloc-model
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Apply semantic-preserving refactors
        run: |
          python3 tools/refactor_delimited.py
          python3 tools/refactor_semir.py
          python3 tools/update_language_docs.py
          gofmt -w parser/parser.go ast/ast.go compiler/semantic_types.go compiler/semantic_types_test.go semir/ir.go semir/validate.go semir/allocation.go semir/allocation_test.go source/source.go source/source_test.go scanner/scanner.go scanner/location_test.go token/token.go token/source.go token/cursor.go token/cursor_test.go layout/layout.go parser/location.go parser/location_test.go parser/lookahead.go parser/separated.go parser/separated_test.go compiler/compilation.go
          go test -race ./...
      - name: Remove temporary refactor machinery
        run: |
          rm tools/refactor_delimited.py tools/refactor_semir.py tools/update_language_docs.py
          rm .github/workflows/finalize-source-delimited.yml
      - name: Commit validated result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Unify source locations parsing and allocation semantics"
          git push origin HEAD:feat/source-delimited-alloc-model
