name: Refactor Delimited Parser V2

on:
  push:
    branches:
      - feat/source-delimited-alloc-model

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/source-delimited-alloc-model
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Apply and validate refactor
        run: |
          python3 tools/refactor_delimited.py
          gofmt -w parser/parser.go ast/ast.go compiler/semantic_types.go compiler/semantic_types_test.go
          go test -race ./...
      - name: Commit validated refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add parser/parser.go ast/ast.go compiler/semantic_types.go compiler/semantic_types_test.go
          git commit -m "Unify delimited parsing and preserve record order"
          git push origin HEAD:feat/source-delimited-alloc-model
